<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="lesson-title">Lesson</title>

  <!-- Local Fonts (Atkinson + Material Symbols) -->
  <link rel="stylesheet" href="../public/assets/fonts/fonts.css">

  <!-- Quiz Styles -->
  <link rel="stylesheet" href="../src/styles/quiz.css">

  <!-- Button Styles -->
  <link rel="stylesheet" href="../src/styles/components/buttons.css">
</head>
<body>

  <audio id="correctSound" preload="auto"><source src="../public/assets/audio/correct.mp3" type="audio/mpeg"></audio>
  <audio id="incorrectSound" preload="auto"><source src="../public/assets/audio/incorrect.mp3" type="audio/mpeg"></audio>

  <div id="fullscreenModalOverlay" class="fullscreen-modal-overlay">
    <iframe id="modalIframe" src="about:blank"></iframe>
  </div>

  <div class="quiz-container">
    <div class="streak-counter" id="streakCounter"></div>

    <div class="header">
      <svg id="close-btn" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" style="color:#AFAFAF; cursor:pointer;">
        <path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/>
      </svg>

      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="lives-container">
        <svg id="lives-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" style="color:#EA4335;">
          <path d="M240,102c0,70-103.79,126.66-108.21,129a8,8,0,0,1-7.58,0C119.79,228.66,16,172,16,102A62.07,62.07,0,0,1,78,40c20.65,0,38.73,8.88,50,23.89C139.27,48.88,157.35,40,178,40A62.07,62.07,0,0,1,240,102Z"/>
        </svg>
        <span id="lives-count">5</span>
      </div>
    </div>

    <div class="feedback-overlay" id="feedbackOverlay" style="display:none;">
      <div class="matching-feedback" id="feedbackPanel">
        <div class="result-main">
          <span class="material-symbols-outlined material-icon" id="cancelIcon">cancel</span>
          <div class="result-header" id="feedbackTitle">Incorrect</div>
          <span class="material-symbols-outlined material-icon" id="notesIcon">stylus_note</span>
        </div>
        <div class="feedback-subtitle" id="feedbackMessage">Let's try that again</div>
        <button class="feedback-button" id="tryAgainBtn">Try Again</button>
      </div>
    </div>

    <button class="matching-continue-btn" id="matchingContinueBtn" style="display:none;">Continue</button>
  </div>

  <div class="image-zoom-modal" id="imageZoomModal">
    <div class="zoom-content">
      <button class="zoom-close" id="zoomCloseBtn">
        <span class="material-symbols-outlined">close</span>
      </button>
      <img id="zoomedImage" src="" alt="Zoomed Image">
      <div class="zoom-label" id="zoomImageLabel"></div>
      <div class="zoom-instructions">Click outside or press ESC to close</div>
    </div>
  </div>

  <script src="../src/js/quiz-engine.js"></script>
  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const course = params.get('course') || 'g12-life-sciences';
      const lesson = params.get('lesson') || 'introduction-to-nucleic-acids';

      document.getElementById('lesson-title').textContent = lesson.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

      try {
        const response = await fetch(`../data/lessons/${course}/${lesson}.json`);
        if (!response.ok) throw new Error(`Lesson data not found (status ${response.status})`);
        const lessonData = await response.json();

        if (!lessonData || !lessonData.questions || !Array.isArray(lessonData.questions)) {
          throw new Error('Lesson data is invalid or missing questions');
        }

        // Ensure the QuizEngine is available
        if (typeof QuizEngine === 'undefined') {
          throw new Error('QuizEngine script failed to load. Check src/js/quiz-engine.js');
        }

        new QuizEngine(lessonData);
      } catch (error) {
        console.error('Lesson loading error:', error);
        // Redirect to a friendly error page with details
        const errorParams = new URLSearchParams({
          title: 'Lesson Not Available',
          message: error.message || 'The lesson could not be loaded.',
          course: course,
          lesson: lesson
        });
        window.location.href = `../pages/404.html?${errorParams.toString()}`;
      }
    })();
  </script>
</body>
</html>
