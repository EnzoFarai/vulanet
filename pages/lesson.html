<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="lesson-title">Lesson</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/src/styles/quiz.css">
  <link rel="stylesheet" href="/src/styles/components/buttons.css">
  <style>
    #close-btn { filter: brightness(0) saturate(100%) invert(77%) sepia(10%) saturate(214%) hue-rotate(174deg) brightness(88%) contrast(92%); }
    #lives-icon { filter: brightness(0) saturate(100%) invert(33%) sepia(98%) saturate(1748%) hue-rotate(330deg) brightness(97%) contrast(94%); }
    img[src*="check_circle.svg"], img[src*="recommend.svg"] { filter: brightness(0) saturate(100%) invert(29%) sepia(51%) saturate(2878%) hue-rotate(108deg) brightness(95%) contrast(94%); }
    img[src*="cancel.svg"], img[src*="stylus_note.svg"] { filter: brightness(0) saturate(100%) invert(21%) sepia(98%) saturate(4140%) hue-rotate(348deg) brightness(91%) contrast(94%); }
    img[src*="rabbit-blue.svg"] { filter: none; }
  </style>
</head>
<body>
  <audio id="correctSound" preload="auto"><source src="/assets/audio/correct.mp3" type="audio/mpeg"></audio>
  <audio id="incorrectSound" preload="auto"><source src="/assets/audio/incorrect.mp3" type="audio/mpeg"></audio>
  <div id="fullscreenModalOverlay" class="fullscreen-modal-overlay"><iframe id="modalIframe" src="about:blank"></iframe></div>
  <div class="quiz-container">
    <div class="streak-counter" id="streakCounter"></div>
    <div class="header">
      <img id="close-btn" src="/assets/icons/phosphor/regular/x.svg" alt="Close" style="width:1.5rem; cursor:pointer;">
      <div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="lives-container"><img id="lives-icon" src="/assets/icons/phosphor/fill/heart.svg" alt="Heart" style="width:1.5rem;"><span id="lives-count">5</span></div>
    </div>
  </div>
  <div class="image-zoom-modal" id="imageZoomModal">
    <div class="zoom-content"><button class="zoom-close" id="zoomCloseBtn"><img src="/assets/icons/phosphor/regular/x.svg" alt="Close" style="width:1.5rem;"></button><img id="zoomedImage" src="" alt="Zoomed Image"><div class="zoom-label" id="zoomImageLabel"></div><div class="zoom-instructions">Click outside or press ESC to close</div></div>
  </div>
  
  <!-- Load quiz-engine as a module -->
  <script type="module" src="/src/js/quiz-engine.js"></script>
  
  <!-- Inline module script -->
  <script type="module">
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const course = params.get('course') || 'g12-life-sciences';
      const lesson = params.get('lesson') || 'introduction-to-nucleic-acids';
      document.getElementById('lesson-title').textContent = lesson.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      
      console.log('course:', course, 'lesson:', lesson);
      const url = `/data/lessons/${course}/${lesson}.json`;
      console.log('Fetching:', url);
      
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        const lessonData = await response.json();
        console.log('Lesson data loaded:', lessonData);
        // QuizEngine should now be available globally
        new window.QuizEngine(lessonData);
      } catch (error) {
        console.error('ERROR loading lesson:', error);
        // Display error on page
        document.body.innerHTML = `<h1>Error loading lesson</h1><p>${error.message}</p><p>URL: ${url}</p>`;
      }
    })();
  </script>
</body>
</html>
