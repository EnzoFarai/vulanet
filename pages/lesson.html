<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="lesson-title">Lesson</title>

  <!-- Local Fonts -->
  <link rel="stylesheet" href="../public/assets/fonts/fonts.css">

  <!-- Phosphor Icons (local) -->
  <link rel="stylesheet" href="../public/assets/icons/phosphor/fill/style.css">
  <link rel="stylesheet" href="../public/assets/icons/phosphor/regular/style.css">

  <!-- Material Symbols (local) -->
  <link rel="stylesheet" href="../public/assets/icons/material-symbols/outline/style.css">

  <!-- Quiz Styles -->
  <link rel="stylesheet" href="../src/styles/quiz.css">

  <!-- Button Styles -->
  <link rel="stylesheet" href="../src/styles/components/buttons.css">
</head>
<body>

  <!-- Audio elements -->
  <audio id="correctSound" preload="auto">
    <source src="../public/assets/audio/correct.mp3" type="audio/mpeg">
  </audio>
  <audio id="incorrectSound" preload="auto">
    <source src="../public/assets/audio/incorrect.mp3" type="audio/mpeg">
  </audio>

  <!-- Fullscreen modal overlay for iframe modals -->
  <div id="fullscreenModalOverlay" class="fullscreen-modal-overlay">
    <iframe id="modalIframe" src="about:blank"></iframe>
  </div>

  <!-- Quiz Container -->
  <div class="quiz-container">
    <div class="streak-counter" id="streakCounter"></div>

    <div class="header">
      <i class="ph ph-x" id="close-btn"></i>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="lives-container">
        <i id="lives-icon" class="ph-fill ph-heart"></i>
        <span id="lives-count">5</span>
      </div>
    </div>

    <!-- Question sections will be dynamically generated by the quiz engine -->

    <!-- Result Overlays will be dynamically generated by the quiz engine -->

  </div>

  <!-- Image Zoom Modal -->
  <div class="image-zoom-modal" id="imageZoomModal">
    <div class="zoom-content">
      <button class="zoom-close" id="zoomCloseBtn">
        <span class="material-symbols-outlined">close</span>
      </button>
      <img id="zoomedImage" src="" alt="Zoomed Image">
      <div class="zoom-label" id="zoomImageLabel"></div>
      <div class="zoom-instructions">Click outside or press ESC to close</div>
    </div>
  </div>

  <!-- Quiz Engine -->
  <script src="../src/js/quiz-engine.js"></script>

  <script>
    (async function() {
      // Get course and lesson from URL parameters
      const params = new URLSearchParams(window.location.search);
      const course = params.get('course') || 'g12-life-sciences';
      const lesson = params.get('lesson') || 'introduction-to-nucleic-acids';

      // Set the page title
      document.getElementById('lesson-title').textContent =
        lesson.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

      // Fetch the lesson data
      let lessonData;
      try {
        const response = await fetch(`../data/lessons/${course}/${lesson}.json`);
        if (!response.ok) throw new Error('Lesson data not found');
        lessonData = await response.json();
      } catch (error) {
        console.error('Failed to load lesson data:', error);
        document.body.innerHTML = '<div style="text-align:center;padding:4rem;"><h2>Lesson not found</h2><p>Please check the URL and try again.</p></div>';
        return;
      }

      // Instantiate the quiz engine with the lesson data
      const engine = new QuizEngine(lessonData);
    })();
  </script>
</body>
</html>
