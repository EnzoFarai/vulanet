<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="lesson-title">Lesson</title>

  <!-- Local Fonts -->
  <link rel="stylesheet" href="../public/assets/fonts/fonts.css">

  <!-- Quiz Styles -->
  <link rel="stylesheet" href="../src/styles/quiz.css">

  <!-- Button Styles -->
  <link rel="stylesheet" href="../src/styles/components/buttons.css">

  <style>
    /* ========== CSS FILTERS FOR MONOCHROME SVG ICONS ========== */
    /* Target all images used in the quiz engine and lesson.html */
    img {
      /* Default: no filter (keeps original colors for already coloured SVGs like rabbit) */
    }

    /* Heart icons – brand red #EA4335 */
    img[src*="heart.svg"] {
      filter: brightness(0) saturate(100%) invert(33%) sepia(98%) saturate(1748%) hue-rotate(330deg) brightness(97%) contrast(94%);
    }

    /* Close (X) icon – light grey #AFAFAF */
    img[src*="x.svg"] {
      filter: brightness(0) saturate(100%) invert(77%) sepia(0%) saturate(0%) brightness(91%) contrast(88%);
    }

    /* Check circle (correct) – success green #2E7D32 */
    img[src*="check_circle.svg"] {
      filter: brightness(0) saturate(100%) invert(26%) sepia(57%) saturate(1439%) hue-rotate(86deg) brightness(92%) contrast(92%);
    }

    /* Cancel & stylus_note (incorrect) – error red #C5221F */
    img[src*="cancel.svg"],
    img[src*="stylus_note.svg"] {
      filter: brightness(0) saturate(100%) invert(17%) sepia(89%) saturate(4055%) hue-rotate(346deg) brightness(93%) contrast(91%);
    }

    /* Recommend icon – blue #4285F4 (used in correct result) */
    img[src*="recommend.svg"] {
      filter: brightness(0) saturate(100%) invert(40%) sepia(84%) saturate(2558%) hue-rotate(199deg) brightness(98%) contrast(92%);
    }

    /* Optional: ensure the rabbit stays as-is (no filter) */
    img[src*="rabbit-blue.svg"] {
      filter: none;
    }
  </style>
</head>
<body>

  <!-- Audio elements -->
  <audio id="correctSound" preload="auto">
    <source src="../public/assets/audio/correct.mp3" type="audio/mpeg">
  </audio>
  <audio id="incorrectSound" preload="auto">
    <source src="../public/assets/audio/incorrect.mp3" type="audio/mpeg">
  </audio>

  <!-- Fullscreen modal overlay for iframe modals -->
  <div id="fullscreenModalOverlay" class="fullscreen-modal-overlay">
    <iframe id="modalIframe" src="about:blank"></iframe>
  </div>

  <!-- Quiz Container -->
  <div class="quiz-container">
    <div class="streak-counter" id="streakCounter"></div>

    <div class="header">
      <!-- X button (close) – local SVG -->
      <img id="close-btn" src="../public/assets/icons/phosphor/regular/x.svg" alt="Close" style="width:1.5rem; cursor:pointer;">

      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="lives-container">
        <img id="lives-icon" src="../public/assets/icons/phosphor/fill/heart.svg" alt="Heart" style="width:1.5rem;">
        <span id="lives-count">5</span>
      </div>
    </div>

    <!-- Question sections will be dynamically generated by the quiz engine -->

    <!-- Matching feedback overlay -->
    <div class="feedback-overlay" id="feedbackOverlay" style="display:none;">
      <div class="matching-feedback" id="feedbackPanel">
        <div class="result-main">
          <img src="../public/assets/icons/material-symbols/outline/cancel.svg" class="material-icon" alt="cancel" style="width:2.5rem;">
          <div class="result-header" id="feedbackTitle">Incorrect</div>
          <img src="../public/assets/icons/material-symbols/outline/stylus_note.svg" class="material-icon" alt="note" style="width:2.5rem;">
        </div>
        <div class="feedback-subtitle" id="feedbackMessage">Let's try that again</div>
        <button class="feedback-button" id="tryAgainBtn">Try Again</button>
      </div>
    </div>

    <button class="matching-continue-btn" id="matchingContinueBtn" style="display:none;">Continue</button>
  </div>

  <!-- Image Zoom Modal -->
  <div class="image-zoom-modal" id="imageZoomModal">
    <div class="zoom-content">
      <button class="zoom-close" id="zoomCloseBtn">
        <img src="../public/assets/icons/phosphor/regular/x.svg" alt="Close" style="width:1.5rem;">
      </button>
      <img id="zoomedImage" src="" alt="Zoomed Image">
      <div class="zoom-label" id="zoomImageLabel"></div>
      <div class="zoom-instructions">Click outside or press ESC to close</div>
    </div>
  </div>

  <!-- Quiz Engine -->
  <script src="../src/js/quiz-engine.js"></script>

  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const course = params.get('course') || 'g12-life-sciences';
      const lesson = params.get('lesson') || 'introduction-to-nucleic-acids';

      document.getElementById('lesson-title').textContent =
        lesson.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

      try {
        const response = await fetch(`../data/lessons/${course}/${lesson}.json`);
        if (!response.ok) throw new Error('Lesson data not found');
        const lessonData = await response.json();
        new QuizEngine(lessonData);
      } catch (error) {
        document.body.innerHTML = '<div style="text-align:center;padding:4rem;"><h2>Lesson not found</h2></div>';
      }
    })();
  </script>
</body>
</html>
