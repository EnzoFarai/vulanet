<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manage Courses — Vulanet</title>

  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/src/styles/components/buttons.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: #FFFFFF;
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
      color: #4B4B4B;
    }

    .canvas {
      max-width: 390px;
      width: 100%;
      background: #FFFFFF;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    .nav-bar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #FFFFFF;
      margin-bottom: 8px;
    }
    .nav-left {
      width: 60px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
    }
    .nav-left img { width: 22px; height: 22px; opacity: 0.7; display: block; }
    .nav-left:hover img { opacity: 1; }
    .nav-left:focus-visible { outline: 2px solid #1CB0F6; outline-offset: 2px; }
    .nav-title {
      font-weight: 700;
      font-size: 18px;
      color: #4B4B4B;
      text-align: center;
    }
    .nav-right { width: 60px; }

    /* ===== COURSE LIST ===== */
    .courses-list {
      width: 100%;
      flex: 1;
      margin-top: 4px;
    }

    .course-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 4px;
      border-bottom: 1px solid #E5E5E5;
    }
    .course-row:last-child { border-bottom: none; }

    .course-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }
    .course-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      background: #F2F2F2;
    }
    .course-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .course-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .course-title {
      font-size: 16px;
      font-weight: 700;
      color: #4B4B4B;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .course-xp {
      font-size: 13px;
      font-weight: 500;
      color: #777777;
    }

    .remove-btn {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #EA4335;
      cursor: pointer;
      background: none;
      border: none;
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      padding: 6px 8px;
      border-radius: 8px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .remove-btn:hover { background: #FFF5F5; }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #777777;
      font-size: 15px;
      line-height: 1.5;
    }

    .warning-footer {
      padding: 24px 32px 40px;
      text-align: center;
      font-size: 13px;
      color: #AFAFAF;
      line-height: 1.5;
    }

    /* ===== BOTTOM SHEET ===== */
    .sheet-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.2);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 2000;
    }
    .sheet-overlay.active { display: flex; }

    .sheet {
      background: #FFFFFF;
      width: 100%;
      max-width: 420px;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      padding: 20px 18px 28px;
      position: relative;
    }
    .sheet.active-sheet { transform: translateY(0); }

    .sheet-drag-area {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .sheet-drag-area .bar {
      width: 44px;
      height: 5px;
      border-radius: 3px;
      background: #AFAFAF;
      display: block;
    }

    .modal-text-section {
      width: 100%;
      margin-top: 24px;
      margin-bottom: 8px;
      text-align: center;
    }
    .modal-title-bold {
      font-weight: 700;
      font-size: 22px;
      line-height: 1.3;
      color: #4B4B4B;
      margin-bottom: 8px;
    }
    .modal-subtext {
      font-weight: 400;
      font-size: 15px;
      line-height: 1.5;
      color: #4B4B4B;
      max-width: 320px;
      margin: 0 auto;
    }

    .scene {
      width: 100%;
      height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
    }
    .emoji-container {
      width: 120px;
      height: 120px;
    }
    .emoji-container img { width: 100%; height: 100%; object-fit: contain; }

    .sheet-actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
<div class="canvas">
  <header class="nav-bar">
    <div class="nav-left" id="backBtn" role="button" tabindex="0" aria-label="Back to settings">
      <img src="/assets/icons/phosphor/regular/arrow-left.svg" alt="">
    </div>
    <span class="nav-title">Manage Courses</span>
    <span class="nav-right"></span>
  </header>

  <div id="courseListContainer" class="courses-list" aria-live="polite">
    <div class="empty-state">Loading your courses…</div>
  </div>

  <div class="warning-footer" id="coursesWarning">
    Be careful, deleting a course gets rid of all your progress and cannot be undone.
  </div>
</div>

<!-- ===== BOTTOM SHEET ===== -->
<div class="sheet-overlay" id="courseSheetOverlay" role="dialog" aria-modal="true">
  <div class="sheet" id="courseSheet">
    <div class="sheet-drag-area" id="sheetDragHandle">
      <span class="bar"></span>
    </div>
    <div class="modal-text-section">
      <div class="modal-title-bold" id="sheetModalTitle">Are you sure?</div>
      <div class="modal-subtext" id="sheetModalSubtext">Be careful. Deleting a course gets rid of all your progress and cannot be undone.</div>
    </div>
    <div class="scene">
      <div class="emoji-container">
        <img src="/assets/lottie/1f627-static.png" alt="" id="sheetEmoji" onerror="this.style.display='none'">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-md btn-ladybug-solid btn-full" id="sheetActionBtn">REMOVE</button>
      <button class="btn btn-md btn-gecko-outline btn-full" id="sheetCancelBtn">CANCEL</button>
    </div>
  </div>
</div>

<script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
    }
  }
</script>

<script type="module">
  import { supabase, isLoggedIn, getCurrentUserProfile } from '/src/js/supabase.js';
  import { getCourseById } from '/src/js/course-data.js';

  // ── DOM ────────────────────────────────────────────────────
  const listEl         = document.getElementById('courseListContainer');
  const warningEl      = document.getElementById('coursesWarning');
  const sheetOverlay   = document.getElementById('courseSheetOverlay');
  const sheet          = document.getElementById('courseSheet');
  const sheetTitle     = document.getElementById('sheetModalTitle');
  const sheetSubtext   = document.getElementById('sheetModalSubtext');
  const sheetActionBtn = document.getElementById('sheetActionBtn');
  const sheetCancelBtn = document.getElementById('sheetCancelBtn');
  const sheetDragHandle= document.getElementById('sheetDragHandle');

  // ── State ──────────────────────────────────────────────────
  let courses = [];              // [{ id, name, xp }]
  let selectedIndex = null;
  let currentUserId = null;
  let isGuest = true;

  // ── Helpers ────────────────────────────────────────────────
  function getIconPath(courseId) {
    const def = getCourseById(courseId);
    if (def && def.icon) return def.icon;
    return `/assets/courses/${courseId}.png`;
  }

  function getName(courseId) {
    const def = getCourseById(courseId);
    return def ? def.name : courseId;
  }

  function getLocalUserCourseIds() {
    try {
      const ids = JSON.parse(localStorage.getItem('userCourses') || '[]');
      if (Array.isArray(ids) && ids.length > 0) return ids;
    } catch (e) { /* noop */ }
    const active = localStorage.getItem('selectedCourseId') || 'g12-life-sciences';
    return [active];
  }

  function computeXpFromLocalStorage(courseId) {
    try {
      const raw = localStorage.getItem(`vulanet_progress_${courseId}`);
      if (!raw) return 0;
      const progress = JSON.parse(raw);
      let completed = 0;
      for (const chId in progress) {
        const ch = progress[chId];
        for (const lessonId in ch) {
          const p = ch[lessonId];
          if (p && (p.status === 'completed' || p.mastered)) completed++;
        }
      }
      return completed * 10; // matches profile.html convention
    } catch (e) {
      return 0;
    }
  }

  // ── Load courses ───────────────────────────────────────────
  async function loadCourses() {
    isGuest = true;
    currentUserId = null;
    courses = [];

    try {
      const loggedIn = await isLoggedIn();
      if (loggedIn) {
        const current = await getCurrentUserProfile();
        if (current && current.user) {
          isGuest = false;
          currentUserId = current.user.id;

          const { data: progress, error } = await supabase
            .from('lesson_progress')
            .select('course_id, status, mastered')
            .eq('user_id', currentUserId);

          if (!error && progress) {
            const grouped = {};
            progress.forEach(row => {
              if (!grouped[row.course_id]) grouped[row.course_id] = 0;
              if (row.status === 'completed' || row.mastered) {
                grouped[row.course_id] += 10;
              }
            });

            courses = Object.keys(grouped).map(id => ({
              id,
              name: getName(id),
              xp: grouped[id]
            }));
          }
        }
      }
    } catch (e) {
      console.error('Failed to load courses from Supabase:', e);
      isGuest = true;
    }

    if (isGuest || courses.length === 0) {
      const ids = getLocalUserCourseIds();
      courses = ids.map(id => ({
        id,
        name: getName(id),
        xp: computeXpFromLocalStorage(id)
      }));
    }

    // Sort by XP descending
    courses.sort((a, b) => b.xp - a.xp);

    renderCourseList();
  }

  // ── Render ─────────────────────────────────────────────────
  function renderCourseList() {
    if (!courses.length) {
      listEl.innerHTML = `<div class="empty-state">You aren't enrolled in any courses yet.</div>`;
      warningEl.textContent = '';
      return;
    }

    const actionLabel = courses.length === 1 ? 'RESET' : 'REMOVE';
    let html = '';
    courses.forEach((course, idx) => {
      html += `
        <div class="course-row" data-index="${idx}">
          <div class="course-left">
            <div class="course-icon">
              <img src="${getIconPath(course.id)}" alt="" loading="lazy"
                   onerror="this.parentElement.style.background='#F2F2F2';this.style.display='none';">
            </div>
            <div class="course-meta">
              <div class="course-title">${course.name}</div>
              <div class="course-xp">${course.xp} XP</div>
            </div>
          </div>
          <button class="remove-btn" data-action="remove" aria-label="${actionLabel} ${course.name}">${actionLabel}</button>
        </div>
      `;
    });
    listEl.innerHTML = html;

    listEl.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const row = e.currentTarget.closest('.course-row');
        const idx = parseInt(row.dataset.index, 10);
        openSheet(idx);
      });
    });

    if (courses.length === 1) {
      warningEl.textContent = 'Be careful, resetting a course gets rid of all your progress and cannot be undone.';
    } else {
      warningEl.textContent = 'Be careful, deleting a course gets rid of all your progress and cannot be undone.';
    }
  }

  // ── Bottom sheet ───────────────────────────────────────────
  function openSheet(index) {
    selectedIndex = index;
    const isLast = courses.length === 1;
    const course = courses[index];

    sheetTitle.textContent = 'Are you sure?';
    if (isLast) {
      sheetSubtext.textContent = `Be careful. Resetting ${course.name} gets rid of all your progress and cannot be undone.`;
      sheetActionBtn.textContent = 'RESET';
    } else {
      sheetSubtext.textContent = `Be careful. Deleting ${course.name} gets rid of all your progress and cannot be undone.`;
      sheetActionBtn.textContent = 'REMOVE';
    }

    sheetOverlay.classList.add('active');
    // trigger transition
    // eslint-disable-next-line no-unused-expressions
    sheet.offsetHeight;
    sheet.classList.add('active-sheet');
    sheetActionBtn.focus();
  }

  function closeSheet() {
    sheet.classList.remove('active-sheet');
    const onEnd = () => {
      sheetOverlay.classList.remove('active');
      sheetOverlay.removeEventListener('transitionend', onEnd);
    };
    sheetOverlay.addEventListener('transitionend', onEnd, { once: true });
    sheet.style.transform = '';
    selectedIndex = null;
  }

  sheetCancelBtn.addEventListener('click', closeSheet);
  sheetOverlay.addEventListener('click', (e) => {
    if (e.target === sheetOverlay) closeSheet();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sheetOverlay.classList.contains('active')) closeSheet();
  });

  // ── Actions ────────────────────────────────────────────────
  async function removeCourseFromSupabase(courseId) {
    if (isGuest || !currentUserId) return true;
    const { error } = await supabase
      .from('lesson_progress')
      .delete()
      .eq('user_id', currentUserId)
      .eq('course_id', courseId);
    if (error) {
      console.error('Supabase delete failed:', error);
      return false;
    }
    return true;
  }

  function clearLocalProgress(courseId) {
    try {
      localStorage.removeItem(`vulanet_progress_${courseId}`);
    } catch (e) { /* noop */ }
  }

  sheetActionBtn.addEventListener('click', async () => {
    if (selectedIndex === null) return;
    const course = courses[selectedIndex];
    const isLast = courses.length === 1;

    sheetActionBtn.disabled = true;
    const originalText = sheetActionBtn.textContent;
    sheetActionBtn.textContent = isLast ? 'RESETTING…' : 'REMOVING…';

    // Always clear local progress for this course
    clearLocalProgress(course.id);

    if (isLast) {
      // RESET: keep the course in the list, reset XP
      await removeCourseFromSupabase(course.id);
      courses[selectedIndex].xp = 0;
    } else {
      // REMOVE
      await removeCourseFromSupabase(course.id);

      // Update local userCourses list
      try {
        const stored = JSON.parse(localStorage.getItem('userCourses') || '[]');
        const filtered = stored.filter(id => id !== course.id);
        localStorage.setItem('userCourses', JSON.stringify(filtered));

        // If we just removed the currently active course, switch
        const active = localStorage.getItem('selectedCourseId');
        if (active === course.id && filtered.length > 0) {
          localStorage.setItem('selectedCourseId', filtered[0]);
        }
      } catch (e) { /* noop */ }

      courses.splice(selectedIndex, 1);
    }

    sheetActionBtn.disabled = false;
    sheetActionBtn.textContent = originalText;
    closeSheet();
    renderCourseList();
  });

  // ── Swipe-to-dismiss ───────────────────────────────────────
  let sheetStartY = 0;
  let sheetCurrentY = 0;
  let isDraggingSheet = false;

  function startDrag(y) {
    sheetStartY = y;
    isDraggingSheet = true;
    sheet.style.transition = 'none';
  }
  function moveDrag(y) {
    if (!isDraggingSheet) return;
    const delta = y - sheetStartY;
    if (delta > 0) {
      sheetCurrentY = delta;
      sheet.style.transform = `translateY(${delta}px)`;
    }
  }
  function endDrag() {
    if (!isDraggingSheet) return;
    isDraggingSheet = false;
    sheet.style.transition = 'transform 0.2s';
    if (sheetCurrentY > 100) {
      closeSheet();
    } else {
      sheet.style.transform = '';
    }
    sheetStartY = 0;
    sheetCurrentY = 0;
  }

  sheetDragHandle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    startDrag(e.clientY);
  });
  window.addEventListener('mousemove', (e) => moveDrag(e.clientY));
  window.addEventListener('mouseup', endDrag);

  sheetDragHandle.addEventListener('touchstart', (e) => {
    e.preventDefault();
    startDrag(e.touches[0].clientY);
  }, { passive: false });
  window.addEventListener('touchmove', (e) => {
    if (!isDraggingSheet) return;
    e.preventDefault();
    moveDrag(e.touches[0].clientY);
  }, { passive: false });
  window.addEventListener('touchend', endDrag);

  // ── Header navigation ──────────────────────────────────────
  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = '/settings';
  });

  // ── Boot ───────────────────────────────────────────────────
  loadCourses();
</script>
</body>
</html>
