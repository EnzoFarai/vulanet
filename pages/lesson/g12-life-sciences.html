<body>
  <!-- Persistent learning card -->
  <div class="learning-card chapter-1" id="persistent-learning-card">
    <div class="text-container"><a href="#" class="section-link"><div class="section">UNIT 1</div></a><a href="#" class="title-link"><div class="title">Chapter 1</div></a><div class="card-progress"><div class="card-progress-bar" id="persistent-progress-bar"></div></div></div>
    <a href="#" class="icon-link"><div class="icon-container"><i class="ph-bold ph-notebook icon"></i></div></a>
  </div>
  <div id="start-speech-bubble"><div class="speech-title">START</div></div>
  <main class="container" id="learning-path-container"></main>
  <script type="module">
    import { CoursePath } from '../../src/js/course-path.js';
    // Course configuration for G12 Life Sciences (4 chapters)
    const courseConfig = {
      id: 'g12-life-sciences',
      name: 'G12 Life Sciences',
      chapters: [
        { title: 'DNA: The Code of Life', lessons: [
          { id: 'ch1l1', title: 'Introduction to Nucleic Acids', type: 'joystick', totalSublessons: 1 },
          { id: 'ch1l2', title: 'DNA: Location, Structure and Functions', type: 'joystick', totalSublessons: 1 },
          { id: 'ch1l3', title: 'DNA Replication', type: 'joystick', totalSublessons: 1 },
          { id: 'ch1t1', title: 'Midway Checkpoint', type: 'treasure' },
          { id: 'ch1l4', title: 'DNA Profiling', type: 'joystick', totalSublessons: 1 },
          { id: 'ch1l5', title: 'RNA: Location, Structure and Function', type: 'joystick', totalSublessons: 1 },
          { id: 'ch1l6', title: 'Protein Synthesis', type: 'joystick', totalSublessons: 1 },
          { id: 'ch1l7', title: 'Chapter Review', type: 'flag', totalSublessons: 1 }
        ] },
        { title: 'Meiosis', lessons: [
          { id: 'ch2l1', title: 'Introduction to Meiosis', type: 'joystick', totalSublessons: 1 },
          { id: 'ch2l2', title: 'Meiosis – The Process', type: 'joystick', totalSublessons: 1 },
          { id: 'ch2l3', title: 'Importance of Meiosis', type: 'joystick', totalSublessons: 1 },
          { id: 'ch2t1', title: 'Treasure Chest', type: 'treasure' },
          { id: 'ch2l4', title: 'Abnormal Meiosis', type: 'joystick', totalSublessons: 1 },
          { id: 'ch2l5', title: 'Comparison of Mitosis and Meiosis', type: 'joystick', totalSublessons: 1 },
          { id: 'ch2l6', title: 'Chapter Review', type: 'flag', totalSublessons: 1 }
        ] },
        { title: 'Reproduction in Vertebrates', lessons: [
          { id: 'ch3l1', title: 'Introduction to Reproduction in Vertebrates', type: 'joystick', totalSublessons: 1 },
          { id: 'ch3l2', title: 'External and Internal Fertilisation', type: 'joystick', totalSublessons: 1 },
          { id: 'ch3l3', title: 'Oviparous, Ovoviviparous, and Viviparous Strategies', type: 'joystick', totalSublessons: 1 },
          { id: 'ch3t1', title: 'Treasure Chest', type: 'treasure' },
          { id: 'ch3l4', title: 'The Amniotic Egg', type: 'joystick', totalSublessons: 1 },
          { id: 'ch3l5', title: 'Precocial and Altricial Development', type: 'joystick', totalSublessons: 1 },
          { id: 'ch3l6', title: 'Parental Care', type: 'joystick', totalSublessons: 1 },
          { id: 'ch3l7', title: 'Chapter Review', type: 'flag', totalSublessons: 1 }
        ] },
        { title: 'Human Reproduction', lessons: [
          { id: 'ch4l1', title: 'Introduction to Human Reproduction', type: 'joystick', totalSublessons: 1 },
          { id: 'ch4l2', title: 'Structure of the male reproductive system', type: 'joystick', totalSublessons: 1 },
          { id: 'ch4l3', title: 'Structure of the Female Reproductive System', type: 'joystick', totalSublessons: 1 },
          { id: 'ch4t1', title: 'Treasure Chest', type: 'treasure' },
          { id: 'ch4l4', title: 'Puberty', type: 'joystick', totalSublessons: 1 },
          { id: 'ch4l5', title: 'Gametogenesis', type: 'joystick', totalSublessons: 1 },
          { id: 'ch4l6', title: 'Menstrual cycle', type: 'joystick', totalSublessons: 1 },
          { id: 'ch4t2', title: 'Treasure Chest', type: 'treasure' },
          { id: 'ch4l7', title: 'Fertilisation and Development of Zygote to Blastocyst', type: 'joystick', totalSublessons: 1 },
          { id: 'ch4l8', title: 'Implantation, Gestation and the Role of the Placenta', type: 'joystick', totalSublessons: 1 },
          { id: 'ch4l9', title: 'Chapter Review', type: 'flag', totalSublessons: 1 }
        ] }
      ]
    };
    // Load user progress from localStorage (or create empty)
    let userProgress = JSON.parse(localStorage.getItem('g12-life-sciences-progress')) || {};
    // Convert to per-chapter format
    const progressPerChapter = courseConfig.chapters.map((ch, idx) => {
      return userProgress[idx] || {};
    });
    const path = new CoursePath(document.getElementById('learning-path-container'), courseConfig, progressPerChapter, {
      onLessonComplete: (lessonId, chIdx) => {
        // save progress
        const newProgress = {};
        path.chaptersData.forEach((ch, i) => {
          newProgress[i] = ch.userProgress;
        });
        localStorage.setItem('g12-life-sciences-progress', JSON.stringify(newProgress));
      },
      onProgressUpdate: (chIdx) => {
        // update persistent progress bar
        const chapter = path.chaptersData[chIdx];
        const total = chapter.lessons.filter(l => l.type !== 'treasure').length;
        let completed = 0;
        chapter.lessons.forEach(l => {
          if (l.type === 'treasure') return;
          const prog = chapter.userProgress[l.id];
          if (prog.status === 'completed' || (l.totalSublessons > 1 && prog.sublessonCompleted.every(c=>c))) completed++;
        });
        const percent = (completed / total) * 100;
        document.getElementById('persistent-progress-bar').style.width = `${percent}%`;
      }
    });
    // Set initial active node
    const firstNode = document.querySelector('.path-node:not(.treasure)');
    if (firstNode) {
      firstNode.click();
    }
  </script>
</body>
</html>
