<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G12 Life Sciences | Vulanet</title>
  <link rel="stylesheet" href="../../public/assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../src/styles/components/buttons.css">
  <link rel="stylesheet" href="../../src/styles/learning-path.css">
  <!-- Local Phosphor and Material Icons (replace with your local paths) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <style>
    /* Additional page-specific overrides (if any) */
  </style>
</head>
<body>
  <!-- Persistent Learning Card -->
  <div class="learning-card chapter-1" id="persistent-learning-card">
    <div class="text-container">
      <a href="#" class="section-link"><div class="section">UNIT 1</div></a>
      <a href="#" class="title-link"><div class="title">Chapter 1</div></a>
      <div class="card-progress"><div class="card-progress-bar" id="persistent-progress-bar"></div></div>
    </div>
    <a href="#" class="icon-link"><div class="icon-container"><i class="ph-bold ph-notebook icon"></i></div></a>
  </div>

  <!-- START Speech Bubble -->
  <div id="start-speech-bubble"><div class="speech-title">START</div></div>

  <main class="container">
    <!-- Chapter containers: each will be populated by JavaScript but must exist -->
    <div id="chapters-container"></div>
  </main>

  <script type="module">
    import { CoursePath } from '../../src/js/course-path.js';

    // Define course data (or fetch from JSON)
    const courseData = {
      id: 'g12-life-sciences',
      chapters: [
        { title: 'DNA: The Code of Life', lessons: [
          { id: 'introduction-to-nucleic-acids', title: 'Introduction to Nucleic Acids', type: 'joystick', totalSublessons: 1 },
          { id: 'dna-location-structure-functions', title: 'DNA: Location, Structure and Functions', type: 'joystick', totalSublessons: 1 },
          { id: 'dna-replication', title: 'DNA Replication', type: 'joystick', totalSublessons: 1 },
          { id: 'midway-checkpoint', title: 'Midway Checkpoint', type: 'treasure' },
          { id: 'dna-profiling', title: 'DNA Profiling', type: 'joystick', totalSublessons: 1 },
          { id: 'rna-structure-function', title: 'RNA: Location, Structure and Function', type: 'joystick', totalSublessons: 1 },
          { id: 'protein-synthesis', title: 'Protein Synthesis', type: 'joystick', totalSublessons: 1 },
          { id: 'chapter-1-review', title: 'Chapter Review', type: 'flag', totalSublessons: 1 }
        ] },
        { title: 'Meiosis', lessons: [
          { id: 'introduction-to-meiosis', title: 'Introduction to Meiosis', type: 'joystick', totalSublessons: 1 },
          { id: 'meiosis-process', title: 'Meiosis – The Process', type: 'joystick', totalSublessons: 1 },
          { id: 'importance-of-meiosis', title: 'Importance of Meiosis', type: 'joystick', totalSublessons: 1 },
          { id: 'treasure-meiosis', title: 'Treasure Chest', type: 'treasure' },
          { id: 'abnormal-meiosis', title: 'Abnormal Meiosis', type: 'joystick', totalSublessons: 1 },
          { id: 'comparison-mitosis-meiosis', title: 'Comparison of Mitosis and Meiosis', type: 'joystick', totalSublessons: 1 },
          { id: 'chapter-2-review', title: 'Chapter Review', type: 'flag', totalSublessons: 1 }
        ] },
        { title: 'Reproduction in Vertebrates', lessons: [
          { id: 'intro-vert-reproduction', title: 'Introduction to Reproduction in Vertebrates', type: 'joystick', totalSublessons: 1 },
          { id: 'external-internal-fertilisation', title: 'External and Internal Fertilisation', type: 'joystick', totalSublessons: 1 },
          { id: 'oviparous-ovoviviparous-viviparous', title: 'Oviparous, Ovoviviparous, and Viviparous Strategies', type: 'joystick', totalSublessons: 1 },
          { id: 'treasure-vert', title: 'Treasure Chest', type: 'treasure' },
          { id: 'amniotic-egg', title: 'The Amniotic Egg', type: 'joystick', totalSublessons: 1 },
          { id: 'precocial-altricial', title: 'Precocial and Altricial Development', type: 'joystick', totalSublessons: 1 },
          { id: 'parental-care', title: 'Parental Care', type: 'joystick', totalSublessons: 1 },
          { id: 'chapter-3-review', title: 'Chapter Review', type: 'flag', totalSublessons: 1 }
        ] },
        { title: 'Human Reproduction', lessons: [
          { id: 'intro-human-reproduction', title: 'Introduction to Human Reproduction', type: 'joystick', totalSublessons: 1 },
          { id: 'male-reproductive-system', title: 'Structure of the male reproductive system', type: 'joystick', totalSublessons: 1 },
          { id: 'female-reproductive-system', title: 'Structure of the Female Reproductive System', type: 'joystick', totalSublessons: 1 },
          { id: 'treasure-human1', title: 'Treasure Chest', type: 'treasure' },
          { id: 'puberty', title: 'Puberty', type: 'joystick', totalSublessons: 1 },
          { id: 'gametogenesis', title: 'Gametogenesis', type: 'joystick', totalSublessons: 1 },
          { id: 'menstrual-cycle', title: 'Menstrual cycle', type: 'joystick', totalSublessons: 1 },
          { id: 'treasure-human2', title: 'Treasure Chest', type: 'treasure' },
          { id: 'fertilisation-blastocyst', title: 'Fertilisation and Development of Zygote to Blastocyst', type: 'joystick', totalSublessons: 1 },
          { id: 'implantation-placenta', title: 'Implantation, Gestation and the Role of the Placenta', type: 'joystick', totalSublessons: 1 },
          { id: 'chapter-4-review', title: 'Chapter Review', type: 'flag', totalSublessons: 1 }
        ] }
      ]
    };

    // Generate chapter containers dynamically (or they can be hardcoded)
    const container = document.getElementById('chapters-container');
    for (let i = 0; i < courseData.chapters.length; i++) {
      const chapterDiv = document.createElement('div');
      chapterDiv.className = 'chapter-container';
      chapterDiv.id = `chapter-${i}`;
      if (i === 0) chapterDiv.style.paddingTop = '110px';
      chapterDiv.innerHTML = `
        <div class="subtitle-container">
          <div class="line"></div>
          <div class="subtitle">${courseData.chapters[i].title}</div>
          <div class="line"></div>
        </div>
        <div class="learning-path-container">
          <div class="learning-path"></div>
        </div>
      `;
      container.appendChild(chapterDiv);
    }

    // Initialize the learning path
    window.path = new CoursePath('chapters-container', courseData);
  </script>
</body>
</html>
