    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"

    <script>
        window.glossaryData = {
            "courseId": "g12-life-sciences",
            "title": "Glossary",
            "subtitle": "G12 Life Sciences",
            "terms": [
                { "term": "Accommodation", "definition": "The adjustment of the shape of the lens to see the objects clearly near or far." },
                { "term": "Acrosome", "definition": "The structure in the head of a sperm cell that contains enzymes which break down the membrane surrounding the ovum." },
                { "term": "ADH", "definition": "The hormone that regulates the amount of water in the human body." },
                { "term": "Albinism", "definition": "The condition that results from the absence of skin pigmentation. (Also: Absence of the protein that forms the pigment melanin that gives the skin colour.)" },
                { "term": "Aldosterone", "definition": "The hormone that regulates the salt concentration in the human body." },
                { "term": "Alleles", "definition": "Different forms of genes which occur at the same locus." },
                { "term": "Allantois", "definition": "Structure for excretion/collects waste from the embryo in an amniotic egg." },
                { "term": "Altricial development", "definition": "Hatchlings/offsprings are usually: poorly developed on hatching, eyes are closed, unable to feed on their own, brain size and intelligence increases a lot after hatching." },
                { "term": "Amnion", "definition": "The fluid-filled sac enclosing the embryo." },
                { "term": "Amniotic egg", "definition": "The embryo protected by the shell of the egg laid by oviparous animals." },
                { "term": "Anaphase I", "definition": "The phase of meiosis during which homologous chromosomes separate and start moving towards opposite poles." },
                { "term": "Anticodon", "definition": "The nitrogen base triplet on the tRNA." },
                { "term": "Artificial selection", "definition": "The deliberate breeding of organisms for desirable characteristics selected by humans." },
                { "term": "Astigmatism", "definition": "A condition where the curvature of the lens or cornea is uneven resulting in distorted image." },
                { "term": "Auditory canal", "definition": "Transmits sound waves to the ear drum/tympanum." },
                { "term": "Australopithecus", "definition": "Genus to which Little Foot, Mrs Ples, Karabo and Taung Child belong." },
                { "term": "Autosomes", "definition": "All the chromosomes of an organism other than the sex chromosomes." },
                { "term": "Axon", "definition": "The structure that sends impulse away from the cell body." },
                { "term": "Base pair", "definition": "Linking of nitrogen bases on the complementary strand of the DNA by hydrogen bond." },
                { "term": "Biogeography", "definition": "The distribution of species in different parts of the world. (Also: The study of the distribution of species in different parts of the world.)" },
                { "term": "Biological control", "definition": "The use of the natural enemy of a pest to control the pest population." },
                { "term": "Blind spot", "definition": "The area with no rods and cones; therefore there is no vision at this spot." },
                { "term": "Carbon footprint", "definition": "Measure of the total amount of carbon dioxide emissions of an individual, a defined population or any company per year." },
                { "term": "Cataract", "definition": "A condition where the lens becomes clouded and opaque." },
                { "term": "Centromere", "definition": "The structure that joins the two halves of a double-stranded chromosome." },
                { "term": "Cerebellum", "definition": "Coordinates all voluntary movements; controls muscle tension to maintain balance. (Also: Part of the brain that controls coordination of voluntary muscular movement.)" },
                { "term": "Cerebrum", "definition": "Controls voluntary actions; receives and interprets sensations from sense organs; centre for higher mental process. (Also: Part of the brain that interprets sensations.)" },
                { "term": "Cervix", "definition": "Lower, narrow part of the uterus; it stretches to allow the baby through during childbirth." },
                { "term": "Chemical control", "definition": "The use of chemical substances such as pesticides to control the pest population." },
                { "term": "Chiasma", "definition": "Point of contact between two chromosomes of a homologous pair during crossing over." },
                { "term": "Chorion", "definition": "The outermost extra-embryonic membrane surrounding the embryo acts as a surface for gas exchange. (Also: The finger-like structures from the outer membrane formed by the embryo.)" },
                { "term": "Choroid", "definition": "Layer behind the retina that supplies nutrients and oxygen to the retina." },
                { "term": "Chromatid", "definition": "One half of a double-stranded chromosome." },
                { "term": "Chromosomal mutations", "definition": "Refer to changes in the normal structure or number of chromosomes." },
                { "term": "Chromosome", "definition": "The structure that is made up of two chromatids joined by a centromere." },
                { "term": "Ciliary body", "definition": "Thickened circular rim of the choroid which contains ciliary muscles." },
                { "term": "Ciliary muscles", "definition": "Muscles whose contraction and relaxation alters the shape of the lens to bring about accommodation." },
                { "term": "Clone", "definition": "A copy of an organism that is genetically identical to the original organism." },
                { "term": "Cloning", "definition": "The process through which a copy of an organism that is genetically identical is formed. (Also: The production of a genetically identical copy of an organism using biotechnology.)" },
                { "term": "Cochlea", "definition": "Spirally coiled portion of the inner ear responsible for the reception of sound." },
                { "term": "Co-dominance", "definition": "A genetic cross in which both alleles are expressed equally in the phenotype." },
                { "term": "Codon", "definition": "The nitrogen base triplets on the mRNA." },
                { "term": "Colour blindness", "definition": "Absence of a protein that make up either the red or green cones/photoreceptors in the eye." },
                { "term": "Complementary", "definition": "Nitrogenous bases that always pair with each other joined by hydrogen bond in a DNA molecule." },
                { "term": "Complete dominance", "definition": "A genetic cross where the dominant allele masks (blocks) the expression of the recessive allele." },
                { "term": "Continuous variation", "definition": "Variation where there is a wide range of phenotype e.g. shoe size, height or skin colour." },
                { "term": "Corpus callosum", "definition": "Connects the right and left hemisphere of the brain - allows communication between the two sides of the brain. (Also: Part of the brain that separates the left side of the brain.)" },
                { "term": "Corpus Lateum", "definition": "The structure that releases progesterone during pregnancy." },
                { "term": "Cowper's gland", "definition": "Produces mucus that helps with the movement of the sperm." },
                { "term": "Cranial nerves", "definition": "Nerves arising from the brain." },
                { "term": "Cytokinesis", "definition": "Division of the cytoplasm." },
                { "term": "Daughter chromosome", "definition": "A single-stranded chromosome formed during Anaphase." },
                { "term": "Dendrites", "definition": "The structures that send impulse towards the cell body." },
                { "term": "Dependent Variable", "definition": "The factor that is influenced by the independent variable (the effect/result of an investigation)." },
                { "term": "Diploid", "definition": "A cell with two sets of chromosomes." },
                { "term": "Discontinuous variation", "definition": "Variation where there is no wide range of phenotype e.g. blood groups or eye colour." },
                { "term": "DNA profile", "definition": "An arrangement of black bars representing DNA fragments of the person." },
                { "term": "DNA Replication", "definition": "The process during which a DNA molecule makes an exact copy (replica). (Also: Doubles the genetic material so it can be shared between the resulting daughter cells. Also: Results in the formation of identical daughter cells during mitosis.)" },
                { "term": "Dominant allele", "definition": "The allele that is expressed (shown) in the phenotype e.g. Tt." },
                { "term": "Double Helix", "definition": "The natural shape of DNA." },
                { "term": "Effector", "definition": "A structure which responds to a stimulus." },
                { "term": "Endocrine gland", "definition": "A gland that pours its secretions (hormones) into the bloodstream." },
                { "term": "Endometrium", "definition": "Inner lining of the uterus; place where the embryo implants and the placenta forms." },
                { "term": "Epididymis", "definition": "Provides storage and maturation of sperm cells." },
                { "term": "Eustachian tube", "definition": "A tube that equalises pressure on either side of the ear drum/tympanic membrane." },
                { "term": "Eutrophication", "definition": "The process whereby nutrients become highly concentrated in a body of water leading to algae bloom." },
                { "term": "Exocrine gland", "definition": "A gland that has its secretions transported by means of ducts." },
                { "term": "External fertilization", "definition": "The sperm fertilises the egg cell outside the body of the female usually in water." },
                { "term": "Fallopian tube", "definition": "Connects the ovaries to the uterus; transports egg cells from the ovary; it is the site of fertilisation." },
                { "term": "Fertilization", "definition": "Fusion of the sperm and an egg cell." },
                { "term": "Fixed/controlled variable", "definition": "Variables that are controlled so that they do not interfere with the purpose of the investigation." },
                { "term": "Food security", "definition": "Access by all people at all times, to adequate, safe and nutritious food for health and reproductive life." },
                { "term": "Foramen magnum", "definition": "A hole in the skull through which the spine joins the skull." },
                { "term": "Fossils", "definition": "Remains of organisms that have existed in the past." },
                { "term": "Gametogenesis", "definition": "Process by which sex chromosomes are produced." },
                { "term": "Gene", "definition": "A section of a DNA molecule that codes for a specific characteristic. (Also: A small portion of the DNA coding for a particular characteristic.)" },
                { "term": "Gene mutation", "definition": "Mutations that affect a single or a few base pairs in just a single gene." },
                { "term": "Gene pool", "definition": "The sum total of all the alleles that are present in a breeding population of a particular species." },
                { "term": "Genetic engineering", "definition": "The manipulation of the genetic material of an organism to get desired changes. (Also: The process whereby the genes on the DNA are changed, transferred or manipulated to produce a different organism.)" },
                { "term": "Genetic modification", "definition": "Manipulation of genetic material to get desired changes." },
                { "term": "Genome", "definition": "An organism's entire hereditary information (genes) encoded either on the DNA or RNA." },
                { "term": "Genotype", "definition": "Genetic make-up (composition) of an organism." },
                { "term": "Gestation", "definition": "The period of development of an embryo in the uterus, between fertilisation and birth." },
                { "term": "Gibberellin", "definition": "A plant growth hormone that stimulates seed germination." },
                { "term": "Gonosome", "definition": "Sex chromosomes (XY or XX)." },
                { "term": "Graafian follicle", "definition": "Produced by the primary follicle and contains the egg cell." },
                { "term": "Haemophilia", "definition": "A sex-linked condition where blood fails to clot properly." },
                { "term": "Haploid", "definition": "A cell with a single set of chromosomes." },
                { "term": "Herbicides", "definition": "Chemical preparation designed to kill plants, especially weeds, or to inhibit their growth." },
                { "term": "Heterozygous", "definition": "Two different alleles for a particular characteristic e.g. Tt." },
                { "term": "Homeostasis", "definition": "A process of maintaining a constant internal environment." },
                { "term": "Hominid/Hominidae", "definition": "The group consisting of modern humans, chimpanzees, gorillas and orangutans plus all their immediate ancestors." },
                { "term": "Hominin", "definition": "The group consisting of modern humans, extinct human species and all our immediate ancestors (include members of the genera Homo, Australopithecus, Paranthropus and Ardipithecus)." },
                { "term": "Homo Habilis", "definition": "Genus to which Homo habilis and Homo erectus belong." },
                { "term": "Homo Sapiens", "definition": "Genus to which the human ancestor belongs." },
                { "term": "Homologous", "definition": "Similar structure in different organisms indicating common ancestry." },
                { "term": "Homologous chromosome", "definition": "A pair of chromosomes, one inherited from each parent, that have the same genes at the same locus." },
                { "term": "Homozygous", "definition": "Two identical alleles for a particular characteristic e.g. TT or tt." },
                { "term": "Human genome", "definition": "The mapping of exact position of all the genes in all the chromosomes of a human." },
                { "term": "Hybrid cross", "definition": "Two characteristics or traits shown in the genetic cross." },
                { "term": "Hydrogen bond", "definition": "The bonds formed between two nitrogen bases." },
                { "term": "Hypothalamus", "definition": "The control centre for hunger, thirst, sleep, body temperature and emotions." },
                { "term": "Hypothesis", "definition": "A tentative explanation of a phenomenon that can be tested. (Also: A proposed solution to the problem that is yet to be tested.)" },
                { "term": "Implantation", "definition": "The process in which the embryo settles on the endometrium and sinks into it; embryo embeds itself in the endometrium." },
                { "term": "Incomplete dominance", "definition": "A genetic cross between two phenotypically different parents produces offsprings that are different from both parents but with an intermediate offspring." },
                { "term": "Independent variable", "definition": "The variable whose influence is tested in an investigation; the variable that is manipulated in an investigation." },
                { "term": "Internal fertilization", "definition": "Fertilization occurs inside the female's reproductive organs." },
                { "term": "Interneuron (connector)", "definition": "Links the sensory neuron to the motor neuron." },
                { "term": "Interphase", "definition": "The phase of meiosis through which DNA replication takes place." },
                { "term": "Iris", "definition": "The coloured part of the eye." },
                { "term": "Karyokinesis", "definition": "Division of the nucleus." },
                { "term": "Karyotype", "definition": "The complete set of chromosomes in the cell of an organism. (Also: The number, shape and the arrangement of all the chromosomes in a nucleus of a somatic cell.)" },
                { "term": "Lens", "definition": "Holds the lens in position." },
                { "term": "Locus", "definition": "The position of a gene on the chromosome." },
                { "term": "Medulla oblongata", "definition": "Transmits nerve impulses between the spinal cord and the brain; controls involuntary actions such as heartbeat and breathing." },
                { "term": "Meiosis", "definition": "Cell division whereby a diploid cell undergoes two cell divisions to form four different cells." },
                { "term": "Melanin", "definition": "Pigment that gives skin its colour." },
                { "term": "Meninges", "definition": "The membranes which protect the central nervous system." },
                { "term": "Mitosis", "definition": "Cell division in which a diploid cell undergoes cell division to form two identical cells." },
                { "term": "Monoculture", "definition": "The act of growing only one type of crop over large areas of land year after year." },
                { "term": "Monohybrid cross", "definition": "Only one characteristic or trait is being shown in the genetic cross." },
                { "term": "Motor (efferent) neuron", "definition": "Transmits impulses from the brain or spinal cord to muscles and glands; the effectors bring about a response." },
                { "term": "mRNA", "definition": "A bar code pattern formed from DNA." },
                { "term": "Mucus plug", "definition": "The structure that forms on the cervix that prevents entrance of bacteria." },
                { "term": "Multiple alleles", "definition": "More than two alternative forms of genes at the same locus." },
                { "term": "Myelin sheath", "definition": "A layer of fat around the axon that prevents the loss of impulse." },
                { "term": "Natural selection", "definition": "The environment or nature is the selective force. (Also: Only organisms with favourable characteristics survive.)" },
                { "term": "Negative feedback", "definition": "Detects changes or imbalances in the internal environment and restores the balance." },
                { "term": "Non disjunction", "definition": "The defect in cell division that leads to Down syndrome." },
                { "term": "Nuclear pore", "definition": "Openings in the nuclear membrane that allow mRNA to leave the nucleus." },
                { "term": "Nucleotide", "definition": "The building blocks (or monomers) of nucleic acid." },
                { "term": "Oestrogen", "definition": "The hormone released by new follicles in the ovary. (Also: A hormone responsible for the development of secondary sexual characteristics in females.)" },
                { "term": "Oogenesis", "definition": "The process by which egg cells or ova are produced in the ovary." },
                { "term": "Optic nerve", "definition": "Carries nerve impulses from the retina to the brain (cerebrum)." },
                { "term": "Out of Africa hypothesis", "definition": "States that modern humans originated in Africa and then migrated out of Africa." },
                { "term": "Ovary", "definition": "Produces egg cells; secretes progesterone and oestrogen." },
                { "term": "Ovipary", "definition": "Reproductive strategy in which eggs are laid and hatching takes place outside the female's body." },
                { "term": "Ovovivipary", "definition": "Young develop from eggs that are fertilised internally and retained inside the mother after fertilisation until they hatch." },
                { "term": "Ovulation", "definition": "The process when the Graafian follicle bursts to release the egg cell." },
                { "term": "Palaeontology", "definition": "The study of remains of organisms that have existed in the past." },
                { "term": "Parasympathetic system", "definition": "The nervous system which consists of cranial and spinal nerves." },
                { "term": "Parental care", "definition": "Offered through building of nests, protecting the eggs, protecting the young or teaching the young." },
                { "term": "Pedigree diagram / Family tree", "definition": "Used to study the inheritance of characteristics in a family over generations." },
                { "term": "Peptide bond", "definition": "The bonds formed between amino acids." },
                { "term": "Peripheral nervous system", "definition": "The nervous system which consists of cranial and spinal nerves." },
                { "term": "Pesticides", "definition": "Chemical substances used to eliminate pests." },
                { "term": "Phenotype", "definition": "The physical appearance of an organism determined by the genotype." },
                { "term": "Phylogenetic tree / Cladogram / Evolutionary tree", "definition": "Represents the possible evolutionary relationship among a set of organisms or groups of organisms." },
                { "term": "Population", "definition": "A group of organisms of the same species that occupy the same habitat." },
                { "term": "Precocial development", "definition": "Hatchlings/offsprings are usually: well developed when they hatch, eyes are open, able to move, able to feed, brain size and intelligence remains the same throughout their life." },
                { "term": "Progesterone", "definition": "A hormone that further thickens the endometrium when secreted; inhibits the secretion of FSH." },
                { "term": "Prognathous", "definition": "Protruding/having wider jaws. (Also: Having pointed face because of projecting jaws and nose.)" },
                { "term": "Prophase I", "definition": "The phase in meiosis where crossing over occurs." },
                { "term": "Prostate gland", "definition": "Produces an alkaline fluid that neutralises the acid from the vagina, which would kill the sperm." },
                { "term": "Protein synthesis", "definition": "The process by which proteins are made in each cell of an organism." },
                { "term": "Punctuated equilibrium", "definition": "The explanation that species experience long periods without physical change, followed by short periods of rapid physical change." },
                { "term": "Pupil", "definition": "Opening in the eye that allows light to enter the eye." },
                { "term": "Pupillary mechanism", "definition": "Regulates the amount of light entering the eye by adjusting the size of the pupil." },
                { "term": "Recessive allele", "definition": "An allele that does not influence the phenotype when found in the heterozygous condition. (Also: The allele that is masked (not shown) in the phenotype when found in the heterozygous condition. It is only expressed in a homozygous condition e.g. tt.)" },
                { "term": "Receptor", "definition": "The structure that receives stimulus and converts it into an impulse." },
                { "term": "Reflex action", "definition": "A quick automatic action that involves the spinal cord and does not involve the brain." },
                { "term": "Reflex arc", "definition": "The path along which the impulse is transmitted to bring about a response to a stimulus." },
                { "term": "Ribosome", "definition": "The site for protein synthesis." },
                { "term": "Seminal vesicle", "definition": "A gland that produces a nutrient-rich fluid that provides energy for the sperm cells." },
                { "term": "Sensory (afferent) neuron", "definition": "Transmits impulses from the sense organs or receptors to the spinal cord and brain." },
                { "term": "Sex-linked characteristics", "definition": "Characteristics or traits that are carried on the sex chromosome." },
                { "term": "Short sightedness (Myopia)", "definition": "A condition where near objects can be seen clearly; inability of the lens to become more flat/eyeball is longer than normal; image falls in front of the retina; cannot see distant objects clearly." },
                { "term": "Somatic cell", "definition": "All cells in the body other than the sex cells (sperm cell/egg cell)." },
                { "term": "Speciation", "definition": "The formation of new species from existing species." },
                { "term": "Species", "definition": "A group of similar organisms that can interbreed and produce fertile offspring." },
                { "term": "Sperm duct / Vas deferens", "definition": "Transports sperm from the epididymis to the urethra." },
                { "term": "Spermatogenesis", "definition": "Process by which sperm cells are produced in the testes." },
                { "term": "Sustainable", "definition": "The act of using natural resources without destroying the ecological balance." },
                { "term": "Synapse", "definition": "The functional connection between the axon of one neuron and the dendrites of another neuron. (Also: The functional connection between the axon of one neuron and the dendrites of another neuron.)" },
                { "term": "Template", "definition": "Strand of DNA upon which another strand of DNA is built during replication or mRNA during transcription." },
                { "term": "Testes", "definition": "Produces sperm cells and the hormone testosterone." },
                { "term": "Testosterone", "definition": "The hormone responsible for secondary sexual characteristics in males. (Also: A hormone responsible for the development of secondary sexual characteristics in males.)" },
                { "term": "Theory", "definition": "An explanation for something that has been observed in nature and which can be supported by facts, laws and tested hypotheses." },
                { "term": "Thyroid stimulating hormone/TSH", "definition": "The hormone inhibited by an increased level of thyroxin." },
                { "term": "Transcription", "definition": "Process through which the mRNA makes a copy of the DNA code to form new proteins." },
                { "term": "Translation", "definition": "The process through which the tRNA brings specific amino acids to the mRNA." },
                { "term": "Umbilical artery", "definition": "Carries deoxygenated blood towards the placenta." },
                { "term": "Umbilical vein", "definition": "The blood vessel in the umbilical cord that carries blood rich in oxygen and nutrients. (Also: Carries oxygenated blood from the placenta to the embryo.)" },
                { "term": "Urethra", "definition": "Transports semen and urine out of the body." },
                { "term": "Uterus/womb", "definition": "Carries the embryo and foetus during pregnancy." },
                { "term": "Vagina", "definition": "Receives the penis and semen during sexual intercourse; the passage through which the baby is born." },
                { "term": "Variation", "definition": "Genotype and phenotype differences among organisms of the same species." },
                { "term": "Vitreous humour", "definition": "A jelly-like substance which gives the shape to the eye." },
                { "term": "Vivipary", "definition": "The young develops inside the uterus of the mother after the eggs are fertilised internally." },
                { "term": "Yellow spot", "definition": "Area on the retina containing lots of rods and cones, and is responsible for bright light and colour vision." },
                { "term": "York sac", "definition": "The structure that provides nutrition to the embryo in an amniotic egg." }
            ]
        };
    </script>

    <script type="module">
        import { loadLayout } from '/src/js/layout.js';
        await loadLayout();

        // Load glossary renderer
        const script = document.createElement('script');
        script.src = '/src/js/glossary.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
