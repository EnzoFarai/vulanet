<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Answer Streak Celebration!</title>
  <link rel="stylesheet" href="../../..//assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../../src/styles/components/buttons.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Atkinson Hyperlegible Next', sans-serif; 
      background: white; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      color: #4B4B4B;
      padding: 1rem;
    }
    
    .app {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 18px 28px;
    }
    
    .celebration-container { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      gap: 2rem; 
      width: 100%;
      text-align: center; 
    }
    
    .celebration-speech-bubble { 
      --bbColor: white; 
      --bbArrowSize: clamp(1rem, 2.5vw, 1.2rem); 
      --bbBorderRadius: 0.4rem; 
      --bbPadding: clamp(1rem, 3vw, 1.2rem); 
      background: var(--bbColor); 
      border-radius: var(--bbBorderRadius); 
      padding: var(--bbPadding); 
      position: relative; 
      border: 2px solid #E5E5E5; 
      color: black; 
      width: 100%; 
      max-width: 300px; 
      min-height: 70px; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.1)); 
    }
    
    .celebration-speech-bubble::before, 
    .celebration-speech-bubble::after { 
      content: ''; 
      position: absolute; 
      z-index: 1; 
    }
    
    .celebration-speech-bubble[pbottom] { margin-bottom: var(--bbArrowSize); }
    
    .celebration-speech-bubble[pbottom]::before { 
      top: 100%; 
      border: solid transparent; 
      border-width: var(--bbArrowSize) calc(var(--bbArrowSize) * 0.75) 0; 
      border-top-color: #E5E5E5; 
    }
    
    .celebration-speech-bubble[pbottom]::after { 
      top: calc(100% - 2px); 
      border: solid transparent; 
      border-width: calc(var(--bbArrowSize) - 2px) calc(var(--bbArrowSize) * 0.75 - 2px) 0; 
      border-top-color: var(--bbColor); 
    }
    
    .celebration-speech-bubble[pbottom][acenter]::before, 
    .celebration-speech-bubble[pbottom][acenter]::after { 
      left: 50%; 
      transform: translateX(-50%); 
    }
    
    .celebration-bubble-text { 
      font-size: clamp(1.1rem, 3vw, 1.3rem); 
      line-height: 1.3; 
      font-weight: 400; 
      color: black; 
    }
    
    .celebration-icon-container { 
      width: 5rem; 
      height: 5rem; 
      flex-shrink: 0; 
      animation: bounce 1.5s ease-in-out infinite; 
    }
    
    .celebration-icon-container img { 
      width: 100%; 
      height: 100%; 
    }
    
    @keyframes bounce { 
      0%, 100% { transform: translateY(0); } 
      50% { transform: translateY(-15px); } 
    }
    
    /* Button container to ensure full width */
    .button-wrapper {
      width: 100%;
      margin-top: 1rem;
    }
    
    /* Force button to be full width and match demo styling */
    .button-wrapper .btn {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <audio id="clappingAudio" preload="auto">
    <source src="../../..//assets/audio/clapping.mp3" type="audio/mpeg">
  </audio>
  
  <div class="app">
    <div class="celebration-container">
      <div class="celebration-speech-bubble" pbottom acenter style="--bbColor:#FFFFFF">
        <div class="celebration-bubble-text" id="celebrationMessage"></div>
      </div>
      
      <div class="celebration-icon-container">
        <img src="../../..//assets/icons/phosphor/fill/rabbit-blue.svg" alt="Vusi">
      </div>
      
      <div class="button-wrapper">
        <button class="btn btn-md btn-carpenter-blue" id="continueBtn">CONTINUE</button>
      </div>
    </div>
  </div>
  
  <script>
    function playClappingSound() { 
      const audio = document.getElementById('clappingAudio'); 
      if (audio) { 
        audio.currentTime = 0; 
        audio.play().catch(e => console.log("Audio play failed:", e)); 
      } 
    }
    
    function getMessageForStreak(streak) {
      switch(streak) { 
        case 5: return "5 in a row! Fantastic!"; 
        case 10: return "Wow, that's now 10 in a row! Is there anything you don't know?"; 
        case 15: return "15 in a row! That's the definition of perfection!"; 
        case 20: return "20 in a row! You're a pro!"; 
        case 25: return "25 in a row! Are you even human?"; 
        default: return `${streak} in a row! Amazing!`; 
      }
    }
    
    const urlParams = new URLSearchParams(window.location.search);
    const streakCount = parseInt(urlParams.get('streak')) || 5;
    document.getElementById('celebrationMessage').textContent = getMessageForStreak(streakCount);
    playClappingSound();
    
    document.getElementById('continueBtn').addEventListener('click', () => {
      window.parent.postMessage('modalClose', '*');
    });
  </script>
</body>
</html>
