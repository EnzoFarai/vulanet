<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>XP Boost Reward</title>
  <link rel="stylesheet" href="../../../public/assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../../src/styles/components/buttons.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      background: #FFFFFF;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .treasure-panel {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 24px 48px;
    }
    .reward-scene { width: 160px; height: 160px; margin: 0 auto; position: relative; }
    .rocket-icon { width: 140px; height: 140px; filter: drop-shadow(0 4px 8px rgba(255, 150, 0, 0.3)); }
    .xp-multiplier {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: 900;
      color: #FF9600;
      background: white;
      padding: 0 8px;
      border-radius: 20px;
    }
    .reward-title { margin-top: 20px; font-weight: 700; color: #0f1c22; font-size: 20px; max-width: 320px; }
    .reward-subtitle { margin-top: 8px; color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    .btn { width: 100%; }
    .log { font-size: 12px; color: gray; margin-top: 20px; word-break: break-word; background: #f5f5f5; padding: 8px; border-radius: 8px; text-align: left; }
  </style>
</head>
<body>
  <div class="treasure-panel">
    <div class="reward-scene">
      <div class="rocket-icon">
        <img src="../../../public/assets/icons/phosphor/duotone/rocket-launch.svg" alt="Rocket" style="width:100%;height:100%;">
      </div>
      <div class="xp-multiplier" id="multiplierDisplay">x1.5</div>
    </div>
    <div class="reward-title">You found an XP Boost!</div>
    <div class="reward-subtitle" id="rewardSubtitle">Congrats! You now have 1.5x XP in lessons for the next 30 minutes.</div>
    <button class="btn btn-md btn-carpenter-blue" id="claimButton">Claim XP Boost</button>
    <div class="log" id="log"></div>
  </div>
  <script>
    function log(msg) {
      console.log('[BoostModal]', msg);
      const logDiv = document.getElementById('log');
      if (logDiv) logDiv.innerHTML += msg + '<br>';
    }

    log('Modal loaded – diagnostic version');
    log('URL: ' + window.location.href);

    const urlParams = new URLSearchParams(window.location.search);
    let multiplier = parseFloat(urlParams.get('multiplier'));
    let duration = parseInt(urlParams.get('duration'));
    log(`Raw params: multiplier=${multiplier}, duration=${duration}`);

    const validMultipliers = [1.5, 2, 3];
    const validDurations = [30, 20, 15];

    if (validMultipliers.includes(multiplier) && validDurations.includes(duration)) {
      document.getElementById('multiplierDisplay').textContent = `x${multiplier}`;
      document.getElementById('rewardSubtitle').textContent = `Congrats! You now have ${multiplier}x XP in lessons for the next ${duration} minutes.`;
      log('Valid boost parameters applied.');
    } else {
      multiplier = 1.5;
      duration = 30;
      document.getElementById('multiplierDisplay').textContent = 'x1.5';
      document.getElementById('rewardSubtitle').textContent = 'Congrats! You now have 1.5x XP in lessons for the next 30 minutes.';
      log('Invalid parameters, using defaults.');
    }

    // Ensure no automatic postMessage
    log('Setting up button click handler.');
    const claimBtn = document.getElementById('claimButton');
    claimBtn.addEventListener('click', function() {
      log('Claim button clicked – sending modalClose');
      window.parent.postMessage('modalClose', '*');
    });

    log('Ready – waiting for user action. No auto-close will happen.');
  </script>
</body>
</html>
