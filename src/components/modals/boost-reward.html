<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>XP Boost Reward</title>
  <link rel="stylesheet" href="../../../public/assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../../src/styles/components/buttons.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      background: #FFFFFF;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .treasure-panel {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 24px 48px;
    }
    .reward-scene { width: 160px; height: 160px; margin: 0 auto; position: relative; }
    .rocket-icon { width: 140px; height: 140px; filter: drop-shadow(0 4px 8px rgba(255, 150, 0, 0.3)); }
    .xp-multiplier {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: 900;
      color: #FF9600;
      background: white;
      padding: 0 8px;
      border-radius: 20px;
    }
    .reward-title { margin-top: 20px; font-weight: 700; color: #0f1c22; font-size: 20px; max-width: 320px; }
    .reward-subtitle { margin-top: 8px; color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    .btn { width: 100%; }
    .error-message { color: #EA4335; margin-bottom: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <audio id="boostAudio" preload="auto" src="../../../public/assets/audio/boost.mp3"></audio>
  <div class="treasure-panel">
    <div class="reward-scene">
      <div class="rocket-icon">
        <img src="../../../public/assets/icons/phosphor/duotone/rocket-launch.svg" alt="Rocket" style="width:100%;height:100%;" onerror="this.src='../../../public/assets/icons/phosphor/fill/rocket-launch.svg'; this.onerror=null;">
      </div>
      <div class="xp-multiplier" id="multiplierDisplay">x1.5</div>
    </div>
    <div class="reward-title" id="rewardTitle">You found an XP Boost!</div>
    <div class="reward-subtitle" id="rewardSubtitle">Congrats! You now have 1.5x XP in lessons for the next 30 minutes.</div>
    <div id="errorMessage" class="error-message" style="display: none;"></div>
    <button class="btn btn-md btn-carpenter-blue" id="claimButton">Claim XP Boost</button>
  </div>
  <script>
    (function() {
      console.log('Boost reward modal loaded – stable version');
      
      // Play audio safely (non‑critical)
      const audio = document.getElementById('boostAudio');
      if (audio) {
        audio.play().catch(e => console.log('Audio play failed (ignored):', e));
      }

      // Parse parameters
      const params = new URLSearchParams(window.location.search);
      let multiplier = parseFloat(params.get('multiplier'));
      let duration = parseInt(params.get('duration'));
      
      // Defaults if missing/invalid
      if (isNaN(multiplier)) multiplier = 1.5;
      if (isNaN(duration)) duration = 30;
      
      const allowedMultipliers = [1.5, 2, 3];
      const allowedDurations = [30, 20, 15];
      
      let isValid = true;
      if (!allowedMultipliers.includes(multiplier)) isValid = false;
      if (!allowedDurations.includes(duration)) isValid = false;
      
      if (!isValid) {
        console.warn('Invalid boost parameters – showing error');
        document.getElementById('multiplierDisplay').style.display = 'none';
        document.getElementById('rewardTitle').style.display = 'none';
        document.getElementById('rewardSubtitle').style.display = 'none';
        document.getElementById('claimButton').style.display = 'none';
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = 'Invalid reward link. This boost cannot be claimed.';
        errorDiv.style.display = 'block';
        // NO auto-close – user must manually close via parent? But there is no close button.
        // To be safe, add a manual close button in error case
        const manualClose = document.createElement('button');
        manualClose.textContent = 'Close';
        manualClose.className = 'btn btn-md btn-cloud-outline';
        manualClose.style.marginTop = '16px';
        manualClose.onclick = () => window.parent.postMessage('modalClose', '*');
        document.querySelector('.treasure-panel').appendChild(manualClose);
      } else {
        // Valid boost
        document.getElementById('multiplierDisplay').textContent = `x${multiplier}`;
        document.getElementById('rewardSubtitle').textContent = `Congrats! You now have ${multiplier}x XP in lessons for the next ${duration} minutes.`;
        document.getElementById('claimButton').addEventListener('click', () => {
          console.log('Claim button clicked – closing boost modal');
          window.parent.postMessage('modalClose', '*');
        });
      }
    })();
  </script>
</body>
</html>
