<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Reward</title>
  <link rel="stylesheet" href="../../public/assets/fonts/fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      background: #FFFFFF;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .treasure-panel { width: 100%; max-width: 420px; padding: 40px 24px 48px; display: flex; flex-direction: column; align-items: center; text-align: center; margin: 0 auto; }
    .reward-scene { width: 100%; height: 200px; margin-top: 20px; display: flex; justify-content: center; align-items: center; }
    .hearts-container { display: flex; justify-content: center; align-items: center; gap: 12px; }
    .hearts-container img { width: 80px; height: 80px; }
    .reward-title { margin-top: 20px; font-weight: 700; color: #0f1c22; font-size: 20px; max-width: 320px; }
    .reward-subtitle { margin-top: 8px; font-weight: 400; color: #6b7280; font-size: 14px; max-width: 280px; margin-bottom: 24px; }
    .claim-button {
      width: 100%; height: 58px; border-radius: 0.75rem; font-weight: 700; letter-spacing: 0.5px;
      border: none; font-size: 16px; text-transform: uppercase; cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      color: #ffffff; background-color: #4285F4; border-bottom: 0.25rem solid #3a75d9;
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
    }
    .claim-button:hover { background-color: #3a75d9; transform: translateY(-0.125rem); }
    .claim-button:active { transform: translateY(0.0625rem); border-bottom-width: 0.125rem; }
    .small-heart-icon { width: 18px; height: 18px; filter: brightness(0) invert(1); }
  </style>
</head>
<body>
  <audio id="heartbeatAudio" preload="auto"><source src="../../public/assets/audio/heartbeat.mp3" type="audio/mpeg"></audio>
  <div class="treasure-panel">
    <div class="reward-scene">
      <div class="hearts-container" id="heartsContainer"></div>
    </div>
    <div class="reward-title" id="rewardTitle">You gained more hearts!</div>
    <div class="reward-subtitle" id="rewardSubtitle">You now have 5 hearts again.</div>
    <button class="claim-button" id="claimButton">Claim hearts <img src="../../public/assets/icons/phosphor/fill/heart.svg" class="small-heart-icon"></button>
  </div>
  <script>
    document.getElementById('heartbeatAudio').play().catch(()=>{});
    const params = new URLSearchParams(window.location.search);
    const heartsParam = params.get('hearts') || 'full';
    const heartCount = heartsParam === 'full' ? 5 : parseInt(heartsParam) || 1;
    const container = document.getElementById('heartsContainer');
    container.innerHTML = '';
    for (let i = 0; i < heartCount; i++) {
      const img = document.createElement('img');
      img.src = '../../public/assets/icons/phosphor/fill/heart.svg';
      container.appendChild(img);
    }
    if (heartCount === 5) {
      document.getElementById('rewardTitle').textContent = 'You gained more hearts!';
      document.getElementById('rewardSubtitle').textContent = 'You now have 5 hearts again.';
    } else {
      document.getElementById('rewardTitle').textContent = heartCount === 1 ? 'You gained a heart!' : 'You gained more hearts!';
      document.getElementById('rewardSubtitle').textContent = `You now have ${heartCount} heart${heartCount > 1 ? 's' : ''}.`;
    }
    document.getElementById('claimButton').addEventListener('click', ()=> window.parent.postMessage('modalClose','*'));
  </script>
</body>
</html>
