<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Heart Reward</title>
  <link rel="stylesheet" href="../../../public/assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../../src/styles/components/buttons.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      background: #FFFFFF;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .treasure-panel {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 24px 48px;
    }
    .reward-scene { width: 100%; height: 160px; display: flex; justify-content: center; align-items: center; }
    .hearts-container { display: flex; gap: 12px; }
    .heart-icon { width: 80px; height: 80px; }
    .heart-icon img {
      filter: brightness(0) saturate(100%) invert(33%) sepia(98%) saturate(1748%) hue-rotate(330deg) brightness(97%) contrast(94%);
    }
    .reward-title { margin-top: 20px; font-weight: 700; color: #0f1c22; font-size: 20px; max-width: 320px; }
    .reward-subtitle { margin-top: 8px; color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    .btn { width: 100%; }
    .error-message { color: #EA4335; margin-bottom: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <audio id="heartbeatAudio" preload="auto" src="../../../public/assets/audio/heartbeat.mp3"></audio>
  <div class="treasure-panel">
    <div class="reward-scene"><div class="hearts-container" id="heartsContainer"></div></div>
    <div class="reward-title" id="rewardTitle">You gained more hearts!</div>
    <div class="reward-subtitle" id="rewardSubtitle">You now have 5 hearts again.</div>
    <div id="errorMessage" class="error-message" style="display: none;"></div>
    <button class="btn btn-md btn-carpenter-blue" id="claimButton">Claim hearts</button>
  </div>
  <script>
    (function() {
      console.log('Heart reward modal loaded');
      const audio = document.getElementById('heartbeatAudio');
      if (audio) audio.play().catch(e => console.log('Audio play failed:', e));

      const params = new URLSearchParams(window.location.search);
      const heartsParam = params.get('hearts') || 'full';
      let heartCount = heartsParam === 'full' ? 5 : (parseInt(heartsParam) || 1);
      if (heartCount < 1 || heartCount > 5) heartCount = 5;

      const container = document.getElementById('heartsContainer');
      container.innerHTML = '';
      for (let i = 0; i < heartCount; i++) {
        const img = document.createElement('img');
        img.src = '../../../public/assets/icons/phosphor/fill/heart.svg';
        img.alt = 'Heart';
        const wrapper = document.createElement('div');
        wrapper.className = 'heart-icon';
        wrapper.appendChild(img);
        container.appendChild(wrapper);
      }
      document.getElementById('rewardSubtitle').textContent = heartCount === 5 ? 'You now have 5 hearts again.' : `You now have ${heartCount} heart${heartCount > 1 ? 's' : ''}.`;
      document.getElementById('claimButton').addEventListener('click', () => {
        console.log('Claim button clicked, closing heart modal');
        window.parent.postMessage('modalClose', '*');
      });
    })();
  </script>
</body>
</html>
