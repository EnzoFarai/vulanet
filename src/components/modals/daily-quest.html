<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Daily Quests</title>
  <link rel="stylesheet" href="../../../public/assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../../src/styles/components/buttons.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff;
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .daily-quests-module { max-width: 500px; width: 100%; }
    .section-title { font-size: 22px; font-weight: 700; color: #3b3b3b; }
    .time-cta { color: #ff9f1a; font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .card { background: #fff; border-radius: 18px; border: 1px solid #eee; box-shadow: 0 6px 18px rgba(15,15,15,0.06); }
    .quests { border-radius: 14px; overflow: hidden; border: 1px solid #eee; }
    .quest-row { padding: 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f0f0f0; }
    .quest-info { flex: 1; }
    .quest-title { font-weight: 700; margin-bottom: 10px; color: #444; font-size: 15px; }
    .progress-wrapper { position: relative; }
    .progress-bar { height: 28px; background: #e6e6e6; border-radius: 20px; overflow: hidden; display: flex; align-items: center; }
    .progress-inner { height: 12px; background: #ffa726; border-radius: 12px; }
    .progress-count {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: #fff; font-weight: 700; font-size: 13px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
      pointer-events: none;
    }
    .progress-count.dark-text { color: #666; text-shadow: none; }
    .chest { width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .chest img { width: 32px; height: 32px; }
    .bronze img { filter: brightness(0) saturate(100%) invert(59%) sepia(76%) saturate(377%) hue-rotate(4deg) brightness(87%) contrast(88%); }
    .silver img { filter: brightness(0) saturate(100%) invert(87%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(83%) contrast(87%); }
    .gold img { filter: brightness(0) saturate(100%) invert(80%) sepia(87%) saturate(1665%) hue-rotate(347deg) brightness(100%) contrast(97%); }
    .chest.claimed { opacity: 0.5; pointer-events: none; }
    .chest.disabled { opacity: 0.3; pointer-events: none; }
    .continue-action { margin-top: 8px; }
    .btn { width: 100%; }
    .daily-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="daily-quests-module">
  <div class="daily-header-row">
    <div class="section-title">Daily Quests</div>
    <div class="time-cta">
      <img src="../../../public/assets/icons/phosphor/bold/clock-countdown.svg" style="width:20px;height:20px;" alt="">
      <span id="timeLeft">20 MINUTES</span>
    </div>
  </div>

  <div class="card quests" id="questsContainer"></div>

  <div class="continue-action">
    <button class="btn btn-md btn-carpenter-blue" id="continueButton">CONTINUE</button>
  </div>
</div>

<script>
  // ---------- HELPER: time remaining until midnight ----------
  function updateTimeLeft() {
    const now = new Date();
    const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
    const ms = endOfDay - now;
    if (ms <= 0) { document.getElementById('timeLeft').textContent = '0 MINUTES'; return; }
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    document.getElementById('timeLeft').textContent = h > 0
      ? `${h} HOUR${h > 1 ? 'S' : ''}`
      : `${Math.max(1, m)} MINUTE${m !== 1 ? 'S' : ''}`;
  }
  updateTimeLeft();
  setInterval(updateTimeLeft, 60000);

  // ---------- LOAD TODAY'S QUESTS ----------
  const today = new Date().toISOString().slice(0, 10);
  const storageKey = `dailyQuests_${today}`;

  let quests = JSON.parse(localStorage.getItem(storageKey));
  if (!quests) {
    // First-time user quests
    quests = [
      { id: 'bronze', title: 'Start a streak', current: 1, total: 1, coins: 50, claimed: false },
      { id: 'silver', title: 'Score 80% or higher in 3 lessons', current: 0, total: 3, coins: 75, claimed: false },
      { id: 'gold', title: 'Complete your next 4 lessons', current: 0, total: 4, coins: 100, claimed: false }
    ];
    localStorage.setItem(storageKey, JSON.stringify(quests));
  }

  // ---------- UPDATE PROGRESS (from URL) ----------
  const urlParams = new URLSearchParams(window.location.search);
  const correctAttempts = parseInt(urlParams.get('correctAttempts')) || 0;
  const totalAttempts = parseInt(urlParams.get('totalAttempts')) || 1;
  const accuracy = Math.round((correctAttempts / totalAttempts) * 100);
  const lessonCompleted = urlParams.get('completed') === 'true';

  // Update silver quest (score ≥ 80%)
  if (accuracy >= 80 && quests[1].current < quests[1].total) {
    quests[1].current++;
  }
  // Update gold quest (complete lessons)
  if (lessonCompleted && quests[2].current < quests[2].total) {
    quests[2].current++;
  }
  localStorage.setItem(storageKey, JSON.stringify(quests));

  // ---------- RENDER QUESTS ----------
  const container = document.getElementById('questsContainer');
  function render() {
    container.innerHTML = '';
    quests.forEach(q => {
      const complete = q.current >= q.total;
      const width = complete ? 100 : (q.total > 0 ? (q.current / q.total) * 100 : 0);
      const row = document.createElement('div');
      row.className = 'quest-row';
      row.innerHTML = `
        <div class="quest-info">
          <div class="quest-title">${q.title}</div>
          <div class="progress-wrapper">
            <div class="progress-bar">
              <div class="progress-inner" style="width:${complete ? 'calc(100% - 20px)' : (width + '%')}; margin-left:${complete ? '10px' : '0'}; background:${width > 0 ? '#ffa726' : '#d9d9d9'}"></div>
              <div class="progress-count ${width === 0 ? 'dark-text' : ''}">${q.current} / ${q.total}</div>
            </div>
          </div>
        </div>
        <div class="chest ${q.id} ${q.claimed ? 'claimed' : ''} ${!complete ? 'disabled' : ''}" data-id="${q.id}" data-coins="${q.coins}">
          <img src="../../../public/assets/icons/phosphor/duotone/treasure-chest.svg" alt="chest">
        </div>
      `;
      container.appendChild(row);
    });

    // Attach chest click handlers
    document.querySelectorAll('.chest:not(.disabled):not(.claimed)').forEach(chest => {
      chest.addEventListener('click', function() {
        const id = this.dataset.id;
        const coins = parseInt(this.dataset.coins);
        const quest = quests.find(q => q.id === id);
        if (!quest || quest.claimed) return;

        // Mark claimed
        quest.claimed = true;
        localStorage.setItem(storageKey, JSON.stringify(quests));

        // Add coins to localStorage
        const currentCoins = parseInt(localStorage.getItem('coins') || '500', 10);
        localStorage.setItem('coins', String(currentCoins + coins));

        // Re-render
        render();

        // Notify parent
        window.parent.postMessage({ type: 'questChestClaimed', chestId: id, amount: coins }, '*');
      });
    });
  }
  render();

  // ---------- CONTINUE BUTTON ----------
  document.getElementById('continueButton').addEventListener('click', () => {
    // Calculate total unclaimed coins from completed quests
    const unclaimed = quests.filter(q => q.current >= q.total && !q.claimed);
    const totalCoins = unclaimed.reduce((sum, q) => sum + q.coins, 0);

    if (totalCoins > 0) {
      // Mark all as claimed
      unclaimed.forEach(q => { q.claimed = true; });
      localStorage.setItem(storageKey, JSON.stringify(quests));
      // Add coins
      const currentCoins = parseInt(localStorage.getItem('coins') || '500', 10);
      localStorage.setItem('coins', String(currentCoins + totalCoins));
    }

    // Notify parent and close
    window.parent.postMessage({ type: 'dailyQuestContinue', totalCoins: totalCoins }, '*');
    window.parent.postMessage('modalClose', '*');
  });
</script>
</body>
</html>
