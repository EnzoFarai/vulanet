<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Quests</title>
<link rel="stylesheet" href="../public/assets/fonts/fonts.css">
<link rel="stylesheet" href="../src/styles/components/buttons.css">
<style>
  /* same as earlier daily-quest styles, using local assets */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: 'Atkinson Hyperlegible Next', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
  .daily-quests-module { max-width: 500px; }
  .section-title { font-size: 22px; font-weight: 700; color: #3b3b3b; }
  .time-cta { color: #ff9f1a; font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .card { background: #fff; border-radius: 18px; border: 1px solid #eee; box-shadow: 0 6px 18px rgba(15,15,15,0.06); margin-bottom: 24px; }
  .quests { border-radius: 14px; overflow: hidden; border: 1px solid #eee; }
  .quest-row { padding: 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f0f0f0; }
  .quest-info { flex: 1; }
  .quest-title { font-weight: 700; margin-bottom: 10px; color: #444; }
  .progress-wrapper { position: relative; }
  .progress-bar { height: 28px; background: #e6e6e6; border-radius: 20px; overflow: hidden; display: flex; align-items: center; }
  .progress-inner { height: 12px; background: #ffa726; border-radius: 12px; }
  .progress-count { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
  .chest { width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; }
  .bronze { color: #cd7f32; } .silver { color: #c0c0c0; } .gold { color: #ffd700; }
  .continue-action { margin-top: 8px; }
  .btn { width: 100%; }
</style>
</head>
<body>
  <div class="daily-quests-module">
    <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
      <div class="section-title">Daily Quests</div>
      <div class="time-cta"><i class="ph-bold ph-clock-countdown"></i> <span id="time-left">20 MINUTES</span></div>
    </div>
    <div class="card quests" id="questsContainer"></div>
    <div class="continue-action"><button class="btn btn-md btn-carpenter-blue" id="continueBtn">CONTINUE</button></div>
  </div>
  <script src="../public/assets/icons/phosphor/bold/style.css"></script>
  <script src="../public/assets/icons/phosphor/duotone/style.css"></script>
  <script>
    // first‑time quests
    const quests = [
      { title: 'Start a streak', current: 1, total: 1, chest: 'bronze', coins: 50, completed: true },
      { title: 'Score 80% or higher in 3 lessons', current: 0, total: 3, chest: 'silver', coins: 75, completed: false },
      { title: 'Complete your next 4 lessons', current: 0, total: 4, chest: 'gold', coins: 100, completed: false }
    ];
    const container = document.getElementById('questsContainer');
    quests.forEach((q, i) => {
      const width = q.total > 0 ? (q.current / q.total) * 100 : 0;
      const complete = q.current >= q.total;
      const row = document.createElement('div');
      row.className = 'quest-row';
      row.innerHTML = `
        <div class="quest-info">
          <div class="quest-title">${q.title}</div>
          <div class="progress-wrapper">
            <div class="progress-bar">
              <div class="progress-inner" style="width:${complete ? 'calc(100% - 20px)' : (width+'%')}; margin-left:${complete ? '10px' : '0'}; background:${complete ? '#ffa726' : '#d9d9d9'}"></div>
              <div class="progress-count" style="color:${complete ? '#fff' : '#999'}">${q.current} / ${q.total}</div>
            </div>
          </div>
        </div>
        <div class="chest ${q.chest}" data-coins="${q.coins}" data-completed="${complete}">
          <i class="ph-duotone ph-treasure-chest"></i>
        </div>
      `;
      container.appendChild(row);
    });

    // claim chests
    document.querySelectorAll('.chest').forEach(chest => {
      chest.addEventListener('click', function() {
        const completed = this.dataset.completed === 'true';
        if (!completed) return;
        const coins = parseInt(this.dataset.coins);
        const currentCoins = parseInt(localStorage.getItem('coins') || '500', 10);
        localStorage.setItem('coins', currentCoins + coins);
        this.style.opacity = '0.5';
        this.style.pointerEvents = 'none';
        window.parent.postMessage({type:'questChestClaimed', amount:coins}, '*');
      });
    });

    document.getElementById('continueBtn').addEventListener('click', () => {
      window.parent.postMessage('modalClose', '*');
    });
  </script>
</body>
</html>
