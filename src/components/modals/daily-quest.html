<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Quests</title>
  <link rel="stylesheet" href="../../../public/assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../../src/styles/components/buttons.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; font-family: 'Atkinson Hyperlegible Next', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .daily-quests-module { max-width: 500px; width: 100%; }
    .section-title { font-size: 22px; font-weight: 700; color: #3b3b3b; }
    .time-cta { color: #ff9f1a; font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .card { background: #fff; border-radius: 18px; border: 1px solid #eee; box-shadow: 0 6px 18px rgba(15,15,15,0.06); margin-bottom: 24px; }
    .quests { margin-top: 8px; border-radius: 14px; overflow: hidden; border: 1px solid #eee; }
    .quest-row { padding: 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f0f0f0; background: #fff; }
    .quest-row:last-child { border-bottom: 0; }
    .quest-info { flex: 1; }
    .quest-title { font-weight: 700; margin: 0 0 10px; color: #444; font-size: 15px; }
    .progress-wrapper { position: relative; width: 100%; }
    .progress-bar { height: 28px; background: #e6e6e6; border-radius: 20px; position: relative; overflow: hidden; display: flex; align-items: center; }
    .progress-inner { height: 12px; background: #ffa726; border-radius: 12px; }
    .progress-count { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; font-weight: 700; letter-spacing: 1px; font-size: 13px; z-index: 2; text-shadow: 0 1px 2px rgba(0,0,0,0.1); pointer-events: none; white-space: nowrap; }
    .progress-count.dark-text { color: #666; text-shadow: none; }
    .chest { width: 44px; height: 44px; border-radius: 8px; flex: 0 0 44px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; transition: transform 0.1s ease; }
    .chest:active { transform: scale(0.95); }
    .chest.claimed { opacity: 0.5; filter: grayscale(0.3); pointer-events: none; cursor: default; }
    .chest.disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
    .bronze { color: #cd7f32; }
    .silver { color: #c0c0c0; }
    .gold { color: #ffd700; }
    .continue-action { width: 100%; margin-top: 8px; }
    .continue-btn { width: 100%; }
  </style>
</head>
<body>
  <div class="daily-quests-module">
    <div class="daily-header-row" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
      <div class="section-title">Daily Quests</div>
      <div class="time-cta" id="time-left-container">
        <img src="../../../public/assets/icons/phosphor/bold/clock-countdown.svg" style="width:18px;height:18px;filter:brightness(0) saturate(100%) invert(72%) sepia(77%) saturate(1712%) hue-rotate(2deg) brightness(101%) contrast(99%);">
        <span id="timeLeft">20 MINUTES</span>
      </div>
    </div>
    <div class="card quests" id="questsContainer"></div>
    <div class="continue-action">
      <button class="btn btn-md btn-carpenter-blue continue-btn" id="continueButton">CONTINUE</button>
    </div>
  </div>

  <script>
    const questAudio = new Audio('../../../public/assets/audio/quest.mp3');
    questAudio.play().catch(e => console.log("Audio play failed:", e));

    const params = new URLSearchParams(window.location.search);
    const correctAttempts = parseInt(params.get('correctAttempts')) || 0;
    const totalAttempts = parseInt(params.get('totalAttempts')) || 1;
    const completed = params.get('completed') === 'true';
    const percentage = Math.round((correctAttempts / totalAttempts) * 100);

    const today = new Date().toISOString().slice(0,10);
    const storageKey = `dailyQuests_${today}`;
    let quests = JSON.parse(localStorage.getItem(storageKey));

    // First-time user quests (if not already set)
    if (!quests) {
      quests = [
        { id: 'bronze', title: 'Start a streak', target: 1, current: 1, completed: true, claimed: false },
        { id: 'silver', title: 'Score 80% or higher in 3 lessons', target: 3, current: (percentage >= 80 ? 1 : 0), completed: false, claimed: false },
        { id: 'gold', title: 'Complete your next 4 lessons', target: 4, current: (completed ? 1 : 0), completed: false, claimed: false }
      ];
    } else {
      // Update progress from this lesson (simplified demo logic)
      if (percentage >= 80) quests[1].current = Math.min(quests[1].target, quests[1].current + 1);
      if (completed) quests[2].current = Math.min(quests[2].target, quests[2].current + 1);
      quests.forEach(q => { q.completed = q.current >= q.target; });
    }
    localStorage.setItem(storageKey, JSON.stringify(quests));

    // Render quests
    const container = document.getElementById('questsContainer');
    container.innerHTML = '';
    const chestTypes = ['bronze','silver','gold'];
    quests.forEach((q, i) => {
      const complete = q.current >= q.target;
      const width = complete ? 100 : (q.target > 0 ? (q.current / q.target) * 100 : 0);
      const row = document.createElement('div');
      row.className = 'quest-row';
      row.innerHTML = `
        <div class="quest-info">
          <div class="quest-title">${q.title}</div>
          <div class="progress-wrapper">
            <div class="progress-bar">
              <div class="progress-inner" style="width:${complete ? 'calc(100% - 20px)' : (width+'%')}; margin-left:${complete ? '10px' : '0'}; background:${complete ? '#ffa726' : '#d9d9d9'}"></div>
              <div class="progress-count ${!complete && width===0 ? 'dark-text' : ''}">${q.current} / ${q.target}</div>
            </div>
          </div>
        </div>
        <div class="chest ${chestTypes[i]} ${q.claimed ? 'claimed' : ''} ${!q.completed ? 'disabled' : ''}" data-id="${q.id}" data-coins="${i===0?50:i===1?75:100}">
          <img src="../../../public/assets/icons/phosphor/duotone/treasure-chest.svg" style="width:32px;height:32px;filter:${i===0?'brightness(0) saturate(100%) invert(53%) sepia(59%) saturate(384%) hue-rotate(350deg) brightness(92%) contrast(84%)':i===1?'brightness(0) saturate(100%) invert(100%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(80%) contrast(100%)':'brightness(0) saturate(100%) invert(84%) sepia(45%) saturate(662%) hue-rotate(1deg) brightness(96%) contrast(95%)'}">
        </div>
      `;
      container.appendChild(row);
    });

    // Claim logic
    function claimChest(id, coins) {
      const q = quests.find(q => q.id === id);
      if (!q || q.claimed || !q.completed) return;
      q.claimed = true;
      localStorage.setItem(storageKey, JSON.stringify(quests));
      // Send coins to parent
      window.parent.postMessage({ type: 'chestClaimed', chestId: id, amount: coins }, '*');
      // Update UI
      const chestEl = document.querySelector(`.chest[data-id="${id}"]`);
      if (chestEl) chestEl.classList.add('claimed');
    }

    // Chest click events
    document.querySelectorAll('.chest:not(.disabled):not(.claimed)').forEach(chest => {
      chest.addEventListener('click', function() {
        const id = this.dataset.id;
        const coins = parseInt(this.dataset.coins);
        claimChest(id, coins);
        // Check if any unclaimed completed quests remain
        const remaining = quests.filter(q => q.completed && !q.claimed);
        if (remaining.length === 0) {
          // All done, close modal
          window.parent.postMessage('modalClose', '*');
        } else {
          // Refresh display (re-render)
          location.reload();
        }
      });
    });

    // CONTINUE button
    document.getElementById('continueButton').addEventListener('click', () => {
      const unclaimed = quests.filter(q => q.completed && !q.claimed);
      if (unclaimed.length > 0) {
        const totalCoins = unclaimed.reduce((sum, q) => sum + (q.id==='bronze'?50:q.id==='silver'?75:100), 0);
        // Claim all at once
        unclaimed.forEach(q => q.claimed = true);
        localStorage.setItem(storageKey, JSON.stringify(quests));
        window.parent.postMessage({ type: 'dailyQuestContinue', amount: totalCoins }, '*');
        window.parent.postMessage('modalClose', '*');
      } else {
        window.parent.postMessage('modalClose', '*');
      }
    });

    // Time left counter
    function updateTimeLeft() {
      const now = new Date();
      const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      const msLeft = endOfDay - now;
      if (msLeft <= 0) {
        document.getElementById('timeLeft').textContent = '0 MINUTES';
        return;
      }
      const hoursLeft = Math.floor(msLeft / (1000*60*60));
      const minutesLeft = Math.floor((msLeft % (1000*60*60)) / (1000*60));
      if (hoursLeft > 0) {
        document.getElementById('timeLeft').textContent = `${hoursLeft} ${hoursLeft===1?'HOUR':'HOURS'}`;
      } else {
        const mins = Math.max(1, minutesLeft);
        document.getElementById('timeLeft').textContent = `${mins} ${mins===1?'MINUTE':'MINUTES'}`;
      }
    }
    updateTimeLeft();
    setInterval(updateTimeLeft, 60000);
  </script>
</body>
</html>
