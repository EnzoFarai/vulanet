<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Quests</title>
  <link rel="stylesheet" href="../../public/assets/fonts/fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; font-family: 'Atkinson Hyperlegible Next', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .daily-quests-module { max-width: 500px; width: 100%; }
    .section-title { font-size: 22px; margin: 0; color: #3b3b3b; font-weight: 700; }
    .time-cta { color: #ff9f1a; font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .card { background: #ffffff; border-radius: 18px; padding: 0; border: 1px solid #eee; box-shadow: 0 6px 18px rgba(15,15,15,0.06); margin-bottom: 24px; }
    .quests { margin-top: 8px; border-radius: 14px; overflow: hidden; border: 1px solid #eee; }
    .quest-row { padding: 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f0f0f0; background: #fff; }
    .quest-info { flex: 1; }
    .quest-title { font-weight: 700; margin: 0 0 10px; color: #444; font-size: 15px; }
    .progress-wrapper { position: relative; width: 100%; }
    .progress-bar { height: 28px; background: #e6e6e6; border-radius: 20px; position: relative; overflow: hidden; display: flex; align-items: center; }
    .progress-inner { height: 12px; background: #ffa726; border-radius: 12px; }
    .progress-count { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; font-weight: 700; letter-spacing: 1px; font-size: 13px; z-index: 2; text-shadow: 0 1px 2px rgba(0,0,0,0.1); pointer-events: none; }
    .progress-count.dark-text { color: #666; text-shadow: none; }
    .chest { width: 44px; height: 44px; border-radius: 8px; flex: 0 0 44px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; }
    .chest:active { transform: scale(0.95); }
    .chest.claimed { opacity: 0.5; pointer-events: none; }
    .chest.disabled { opacity: 0.3; pointer-events: none; }
    .bronze { color: #cd7f32; } .silver { color: #c0c0c0; } .gold { color: #ffd700; }
    .continue-action { width: 100%; margin-top: 8px; }
    .continue-btn {
      width: 100%; background: #4285F4; border: none; border-radius: 0.75rem; padding: 14px 20px;
      font-weight: 700; font-size: 15px; text-transform: uppercase; color: white; cursor: pointer;
      border-bottom: 4px solid #3a75d9; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: all 0.2s ease; font-family: 'Atkinson Hyperlegible Next', sans-serif;
    }
    .continue-btn:hover { background: #2a75f0; transform: translateY(-1px); }
    .continue-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
  </style>
</head>
<body>
  <div class="daily-quests-module">
    <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
      <div class="section-title">Daily Quests</div>
      <div class="time-cta"><span class="material-symbols-outlined" style="font-size:20px;">schedule</span> <span id="time-left">20 MINUTES</span></div>
    </div>
    <div class="card quests" id="questsContainer"></div>
    <div class="continue-action"><button class="continue-btn" id="continueButton">CONTINUE</button></div>
  </div>
  <script>
    function updateTime() {
      const now = new Date();
      const end = new Date(now); end.setHours(23,59,59,999);
      const diff = end - now;
      if (diff <= 0) { document.getElementById('time-left').textContent = '0 MINUTES'; return; }
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      document.getElementById('time-left').textContent = h > 0 ? `${h} HOURS` : `${m} MINUTES`;
    }
    updateTime(); setInterval(updateTime, 60000);

    const params = new URLSearchParams(window.location.search);
    const correct = parseInt(params.get('correctAttempts'))||0;
    const total = parseInt(params.get('totalAttempts'))||1;
    const completed = params.get('completed')==='true';
    const percentage = Math.round((correct / total) * 100);

    const today = new Date().toISOString().slice(0,10);
    const storageKey = `dailyQuest_${today}`;
    let quests = JSON.parse(localStorage.getItem(storageKey));
    if (!quests) {
      quests = [
        { title:'Start a streak', current:1, total:1, chest:'bronze', coins:50, claimed:false },
        { title:'Score 80% or higher in 3 lessons', current: percentage>=80?1:0, total:3, chest:'silver', coins:75, claimed:false },
        { title:'Complete your next 4 lessons', current:1, total:4, chest:'gold', coins:100, claimed:false }
      ];
      localStorage.setItem(storageKey, JSON.stringify(quests));
    }

    const container = document.getElementById('questsContainer');
    container.innerHTML = '';
    quests.forEach((q,i) => {
      const complete = q.current >= q.total;
      const width = complete ? 100 : (q.current/q.total)*100;
      const row = document.createElement('div');
      row.className = 'quest-row';
      row.innerHTML = `
        <div class="quest-info">
          <div class="quest-title">${q.title}</div>
          <div class="progress-wrapper">
            <div class="progress-bar">
              <div class="progress-inner" style="width:${complete?'calc(100% - 20px)':(width+'%')}; margin-left:${complete?'10px':'0'}; background:${width>0?'#ffa726':'#d9d9d9'}"></div>
              <div class="progress-count${width===0?' dark-text':''}">${q.current} / ${q.total}</div>
            </div>
          </div>
        </div>
        <div class="chest ${q.chest}${q.claimed?' claimed':''}${!complete?' disabled':''}" data-idx="${i}" data-coins="${q.coins}" data-complete="${complete}" data-claimed="${q.claimed}">
          <span class="material-symbols-outlined">treasure_chest</span>
        </div>
      `;
      container.appendChild(row);
    });

    document.querySelectorAll('.chest:not(.disabled):not(.claimed)').forEach(chest => {
      chest.addEventListener('click', function(){
        const idx = parseInt(this.dataset.idx);
        quests[idx].claimed = true;
        localStorage.setItem(storageKey, JSON.stringify(quests));
        this.classList.add('claimed');
        const coins = parseInt(this.dataset.coins);
        const current = parseInt(localStorage.getItem('coins')||'500',10);
        localStorage.setItem('coins', current + coins);
        window.parent.postMessage({type:'questChestClaimed', chestId:quests[idx].chest, amount:coins}, '*');
      });
    });

    document.getElementById('continueButton').addEventListener('click', ()=>{
      window.parent.postMessage({type:'dailyQuestContinue', quests}, '*');
      window.parent.postMessage('modalClose','*');
    });
  </script>
</body>
</html>
