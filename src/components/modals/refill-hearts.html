<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refill Hearts</title>
<link rel="stylesheet" href="../../..//assets/fonts/fonts.css">
<link rel="stylesheet" href="../../../src/styles/components/buttons.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Atkinson Hyperlegible Next', system-ui, -apple-system, sans-serif; background: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .app { width: 100%; max-width: 420px; padding: 24px 18px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .scene { width: 100%; height: 200px; margin-top: 20px; display: flex; justify-content: center; align-items: center; }
  .emoji-container { width: 160px; height: 160px; }
  lottie-player { width: 160px !important; height: 160px !important; }
  .title { margin-top: 20px; text-align: center; font-weight: 700; color: #4B4B4B; font-size: 20px; max-width: 320px; }
  .subtitle { margin-top: 8px; text-align: center; font-weight: 400; color: #4B4B4B; font-size: 14px; max-width: 280px; }
  .buttons-container { width: 100%; display: flex; flex-direction: column; gap: 16px; margin-top: 40px; }
  /* Force buttons to be full width inside the container */
  .buttons-container .btn {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<audio id="outOfHeartsAudio" preload="auto"><source src="../../..//assets/audio/out-of-hearts.mp3" type="audio/mpeg"></audio>
<div class="app">
  <div class="scene">
    <div class="emoji-container">
      <lottie-player src="../../..//assets/lottie/1f494.json" background="transparent" speed="1" loop autoplay></lottie-player>
    </div>
  </div>
  <div class="title">You're out of hearts!</div>
  <div class="subtitle">You need hearts to progress and keep learning.</div>
  <div class="buttons-container">
    <button class="btn btn-md btn-carpenter-blue" id="refillBtn">REFILL FOR 450</button>
    <button class="btn btn-md btn-cloud-outline" id="noThanksBtn">NO THANKS</button>
  </div>
</div>
<script src="../../../src/lib/lottie-player.js"></script>
<script>
  const audio = document.getElementById('outOfHeartsAudio'); audio.play().catch(()=>{});
  document.getElementById('refillBtn').addEventListener('click', () => window.parent.postMessage({ type: 'refillHearts' }, '*'));
  document.getElementById('noThanksBtn').addEventListener('click', () => window.parent.postMessage('modalQuit', '*'));
</script>
</body>
</html>
