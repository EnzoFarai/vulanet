<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Record</title>

<link rel="stylesheet" href="../../..//assets/fonts/fonts.css">
<link rel="stylesheet" href="../../../src/styles/components/buttons.css">
<script src="../../../src/lib/html2canvas.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Atkinson Hyperlegible Next', sans-serif;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    background: transparent;
    z-index: 100;
  }

  .header-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .header-icon img { width: 24px; height: 24px; filter: brightness(0) saturate(100%) invert(63%) sepia(0%) saturate(0%) hue-rotate(180deg) brightness(88%) contrast(85%); }

  .app {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    padding: 80px 18px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .scene { width: 100%; height: 220px; display: flex; justify-content: center; align-items: center; }
  .record-card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }

  .record-diamond {
    width: 120px; height: 120px;
    transform: rotate(45deg);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }
  .record-diamond-content { transform: rotate(-45deg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .record-icon { width: 32px; height: 32px; margin-bottom: 6px; filter: brightness(0) saturate(100%) invert(100%); }
  .record-number { font-weight: 700; font-size: 18px; color: white; line-height: 1.2; }
  .record-title { font-weight: 600; font-size: 18px; margin-top: 8px; color: #0f1c22; }
  .record-date { font-size: 14px; color: #fff; background-color: #D4AF37; padding: 6px 16px; border-radius: 20px; font-weight: 600; }

  .title { margin-top: 32px; text-align: center; font-weight: 700; color: #0f1c22; font-size: 20px; max-width: 320px; }

  .buttons-container { width: 100%; display: flex; flex-direction: column; gap: 16px; margin-top: 40px; }
  .btn { width: 100%; }

  /* Share overlay – identical to achievement */
  .share-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
  .share-content { max-width: 357px; width: 100%; background: #f5f5f7; border-radius: 24px; overflow: hidden; }
  .share-card { background: white; border-radius: 24px; padding: 32px 24px; margin-bottom: 10px; text-align: center; }
  .share-sheet { background: white; border-top: 1px solid #dadada; border-radius: 24px 24px 0 0; padding: 16px 12px; }
  .share-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .share-item, .bottom-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .share-icon-circle, .bottom-icon-circle { width: 44px; height: 44px; border-radius: 50%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .share-icon, .bottom-icon { width: 28px; height: 28px; }
  .share-icon img { width: 100%; height: 100%; object-fit: contain; }
  .share-text, .bottom-text { font-size: 11px; color: #333; }
  .bottom-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 0 20px; }
  .share-brand { margin-top: 16px; font-weight: 700; color: #4285F4; font-size: 24px; }

  @media (max-width: 768px) {
    .title { font-size: 18px; max-width: 280px; }
    .scene { height: 200px; }
    .record-diamond { width: 110px; height: 110px; }
    .record-icon { width: 28px; height: 28px; }
    .record-number { font-size: 16px; }
    .buttons-container { margin-top: 32px; }
    .btn { height: 48px; font-size: 15px; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="header-icon" id="exit-button">
    <img src="../../..//assets/icons/material-symbols/outline/close.svg" alt="Close">
  </div>
  <div class="header-icon" id="share-button">
    <img src="../../..//assets/icons/material-symbols/outline/upload.svg" alt="Share">
  </div>
</div>

<div class="app">
  <div class="scene">
    <div class="record-card" id="record-card">
      <div class="record-diamond" id="recordDiamond">
        <div class="record-diamond-content">
          <img id="record-icon" class="record-icon" src="" alt="">
          <div class="record-number" id="record-number">305</div>
        </div>
      </div>
      <div class="record-title" id="record-title">Longest Streak</div>
      <div class="record-date" id="currentDate"></div>
    </div>
  </div>

  <div class="title" id="record-message">You reached a 305 day streak!</div>

  <div class="buttons-container">
    <button class="btn btn-md btn-carpenter-blue" id="claimRewardBtn">CLAIM REWARD</button>
  </div>
</div>

<!-- Share overlay -->
<div class="share-overlay" id="share-overlay">
  <div class="share-content">
    <div class="share-card" id="share-card">
      <div class="record-diamond" id="shareDiamond">
        <div class="record-diamond-content">
          <img id="shareIcon" class="record-icon" src="" alt="">
          <div class="record-number" id="shareNumber">305</div>
        </div>
      </div>
      <div class="record-title" id="shareTitle">Longest Streak</div>
      <div class="record-date" id="shareDate"></div>
      <div class="title" style="margin-top: 20px; font-size: 18px;" id="shareMessageText">I set a new record for my longest streak!</div>
      <div class="share-brand">vulanet</div>
    </div>
    <div class="share-sheet">
      <div class="share-grid">
        <div class="share-item" id="share-facebook"><div class="share-icon-circle"><div class="share-icon"><img src="../../..//assets/icons/social/facebook-full.svg"></div></div><div class="share-text">Facebook</div></div>
        <div class="share-item" id="share-x"><div class="share-icon-circle"><div class="share-icon"><img src="../../..//assets/icons/social/x-twitter.svg"></div></div><div class="share-text">X</div></div>
        <div class="share-item" id="share-whatsapp"><div class="share-icon-circle"><div class="share-icon"><img src="../../..//assets/icons/social/whatsapp.svg"></div></div><div class="share-text">WhatsApp</div></div>
        <div class="share-item" id="share-sms"><div class="share-icon-circle"><div class="share-icon"><img src="../../..//assets/icons/material-symbols/outline/sms.svg"></div></div><div class="share-text">Message</div></div>
      </div>
      <div class="bottom-grid">
        <div class="bottom-item" id="save-image"><div class="bottom-icon-circle"><div class="bottom-icon"><img src="../../..//assets/icons/material-symbols/outline/download.svg"></div></div><div class="bottom-text">Save image</div></div>
        <div class="bottom-item" id="more-options"><div class="bottom-icon-circle"><div class="bottom-icon"><img src="../../..//assets/icons/material-symbols/outline/more_horiz.svg"></div></div><div class="bottom-text">More</div></div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const audio = new Audio('../../..//assets/audio/achievement.mp3');
    audio.play().catch(() => {});

    const params = new URLSearchParams(window.location.search);
    const type = params.get('type') || 'longestStreak';  // longestStreak, highestLeague, perfectLessons, mostXP
    const value = params.get('value') || '305';
    const coins = parseInt(params.get('coins')) || 200;   // 200 for all records except longestStreak (0)
    const color = params.get('color') || '#ff6336';
    const icon = params.get('icon') || 'fire';
    const title = params.get('title') || 'Longest Streak';
    const message = params.get('message') || `You reached a ${value} day streak!`;
    const shareMsg = params.get('shareMsg') || `I set a new record for my longest streak!`;

    document.getElementById('recordDiamond').style.backgroundColor = color;
    document.getElementById('record-icon').src = `../../..//assets/icons/phosphor/fill/${icon}.svg`;
    document.getElementById('record-number').textContent = value;
    document.getElementById('record-title').textContent = title;
    document.getElementById('record-message').textContent = message;

    const now = new Date();
    const dateStr = now.getDate() + ' ' + now.toLocaleString('en-US', { month: 'long' }) + ' ' + now.getFullYear();
    document.getElementById('currentDate').textContent = dateStr;

    // Share
    document.getElementById('shareDiamond').style.backgroundColor = color;
    document.getElementById('shareIcon').src = `../../..//assets/icons/phosphor/fill/${icon}.svg`;
    document.getElementById('shareNumber').textContent = value;
    document.getElementById('shareTitle').textContent = title;
    document.getElementById('shareDate').textContent = dateStr;
    document.getElementById('shareMessageText').textContent = shareMsg;

    document.getElementById('claimRewardBtn').addEventListener('click', () => {
      window.parent.postMessage({ type: 'recordClaimed', coins: coins }, '*');
      window.parent.postMessage('modalClose', '*');
    });

    document.getElementById('exit-button').addEventListener('click', () => window.parent.postMessage('modalClose', '*'));

    const shareOverlay = document.getElementById('share-overlay');
    document.getElementById('share-button').addEventListener('click', () => shareOverlay.style.display = 'flex');
    shareOverlay.addEventListener('click', e => { if (e.target === shareOverlay) shareOverlay.style.display = 'none'; });

    function getShareText() { return shareMsg + ' #Vulanet'; }

    document.getElementById('share-facebook').addEventListener('click', () => window.open(`https://www.facebook.com/sharer/sharer.php?u=https://vulanet.com&quote=${encodeURIComponent(getShareText())}`));
    document.getElementById('share-x').addEventListener('click', () => window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(getShareText())}`));
    document.getElementById('share-whatsapp').addEventListener('click', () => window.open(`https://wa.me/?text=${encodeURIComponent(getShareText())}`));
    document.getElementById('share-sms').addEventListener('click', () => {
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) window.location.href = `sms:?body=${encodeURIComponent(getShareText())}`;
      else navigator.clipboard.writeText(getShareText()).then(() => alert('Copied!'));
    });
    document.getElementById('save-image').addEventListener('click', async () => {
      const card = document.getElementById('share-card');
      await document.fonts.ready;
      html2canvas(card, { scale: 2 }).then(canvas => {
        const a = document.createElement('a');
        a.download = 'vulanet-record.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      });
    });
    document.getElementById('more-options').addEventListener('click', async () => {
      if (navigator.share) await navigator.share({ title: 'My Vulanet Record', text: getShareText() });
      else alert('Share not supported.');
    });
  })();
</script>
</body>
</html>
