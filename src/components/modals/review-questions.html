<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Mistakes</title>
  <link rel="stylesheet" href="../../../public/assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../../src/styles/components/buttons.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Atkinson Hyperlegible Next', sans-serif; 
      background: white; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      color: #4B4B4B;
      padding: 1rem;
    }
    
    .app {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 18px 28px;
    }
    
    .review-container { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      gap: 2rem; 
      width: 100%;
      text-align: center; 
    }
    
    .review-speech-bubble { 
      --bbColor: white; 
      --bbArrowSize: clamp(1rem, 2.5vw, 1.2rem); 
      --bbBorderRadius: 0.4rem; 
      --bbPadding: clamp(1rem, 3vw, 1.2rem); 
      background: var(--bbColor); 
      border-radius: var(--bbBorderRadius); 
      padding: var(--bbPadding); 
      position: relative; 
      border: 2px solid #E5E5E5; 
      color: black; 
      width: 100%; 
      max-width: 320px; 
      min-height: 70px; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.1)); 
    }
    
    .review-speech-bubble::before, 
    .review-speech-bubble::after { 
      content: ''; 
      position: absolute; 
      z-index: 1; 
    }
    
    .review-speech-bubble[pbottom] { margin-bottom: var(--bbArrowSize); }
    
    .review-speech-bubble[pbottom]::before { 
      top: 100%; 
      border: solid transparent; 
      border-width: var(--bbArrowSize) calc(var(--bbArrowSize) * 0.75) 0; 
      border-top-color: #E5E5E5; 
    }
    
    .review-speech-bubble[pbottom]::after { 
      top: calc(100% - 2px); 
      border: solid transparent; 
      border-width: calc(var(--bbArrowSize) - 2px) calc(var(--bbArrowSize) * 0.75 - 2px) 0; 
      border-top-color: var(--bbColor); 
    }
    
    .review-speech-bubble[pbottom][acenter]::before, 
    .review-speech-bubble[pbottom][acenter]::after { 
      left: 50%; 
      transform: translateX(-50%); 
    }
    
    .review-bubble-text { 
      font-size: clamp(1rem, 2.5vw, 1.2rem); 
      line-height: 1.4; 
      font-weight: 400; 
      color: black; 
    }
    
    .review-icon-container { 
      width: 5rem; 
      height: 5rem; 
      flex-shrink: 0; 
    }
    
    .review-icon-container img { 
      width: 100%; 
      height: 100%; 
    }
    
    /* Button container to ensure full width */
    .button-wrapper {
      width: 100%;
      margin-top: 1rem;
    }
    
    /* Force button to be full width and match demo styling */
    .button-wrapper .btn {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <audio id="rewindAudio" preload="auto">
    <source src="../../../public/assets/audio/rewind.mp3" type="audio/mpeg">
  </audio>
  
  <div class="app">
    <div class="review-container">
      <div class="review-speech-bubble" pbottom acenter style="--bbColor:#FFFFFF">
        <div class="review-bubble-text">Practice makes perfect. Let's review your mistakes before we go ahead.</div>
      </div>
      
      <div class="review-icon-container">
        <img src="../../../public/assets/icons/phosphor/fill/rabbit-blue.svg" alt="Vusi">
      </div>
      
      <div class="button-wrapper">
        <button class="btn btn-md btn-carpenter-blue" id="continueBtn">CONTINUE</button>
      </div>
    </div>
  </div>
  
  <script>
    const audio = document.getElementById('rewindAudio');
    audio.play().catch(() => {});
    
    document.getElementById('continueBtn').addEventListener('click', () => {
      window.parent.postMessage('modalClose', '*');
    });
  </script>
</body>
</html>
