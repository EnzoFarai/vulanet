<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievement</title>
  <link rel="stylesheet" href="../../public/assets/fonts/fonts.css">
  <script src="../../src/lib/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #ffffff; font-family: 'Atkinson Hyperlegible Next', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .app { max-width: 420px; width: 100%; padding: 80px 18px 28px; display: flex; flex-direction: column; align-items: center; }
    .scene { width: 100%; height: 220px; display: flex; justify-content: center; align-items: center; }
    .achievement-diamond { position: relative; width: 120px; height: 120px; transform: rotate(45deg); border-radius: 16px; display: flex; align-items: center; justify-content: center; background-color: #2563eb; }
    .achievement-diamond-content { transform: rotate(-45deg); display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; color: white; }
    .achievement-icon { font-size: 32px; margin-bottom: 6px; }
    .achievement-number { font-weight: 700; font-size: 18px; }
    .achievement-title { font-weight: 600; font-size: 18px; margin-top: 12px; color: #0f1c22; }
    .achievement-date { font-size: 14px; color: #fff; background: #D4AF37; padding: 6px 16px; border-radius: 20px; font-weight: 600; margin-top: 8px; }
    .title-text { margin-top: 20px; text-align: center; font-weight: 700; color: #0f1c22; font-size: 20px; max-width: 320px; }
    .buttons-container { width: 100%; display: flex; flex-direction: column; gap: 16px; margin-top: 40px; }
    .action-button {
      width: 100%; height: 52px; border-radius: 0.75rem; font-weight: 700; letter-spacing: 0.5px;
      border: none; font-size: 15px; text-transform: uppercase; cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; line-height: 1;
      color: #ffffff; background-color: #4285F4; border-bottom: 0.25rem solid #3a75d9;
    }
    .action-button:hover { background-color: #3a75d9; transform: translateY(-0.125rem); }
    .action-button:active { transform: translateY(0.0625rem); border-bottom-width: 0.125rem; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 60px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: transparent; z-index: 100; }
    .header-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #5F6368; font-size: 24px; }
    .share-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .share-content { width: 100%; max-width: 357px; background: #f5f5f7; border-radius: 24px; overflow: hidden; }
    .share-card { background: #ffffff; border-radius: 24px; padding: 32px 24px 28px; margin-bottom: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .share-brand { margin-top: 16px; font-weight: 700; color: #4285F4; font-size: 24px; }
    .share-sheet { background: #fff; border-top: 1px solid #dadada; border-radius: 24px 24px 0 0; padding: 16px 12px; }
    .share-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
    .share-item, .bottom-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .share-icon-circle, .bottom-icon-circle { width: 44px; height: 44px; border-radius: 50%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .share-icon img { width: 28px; height: 28px; object-fit: contain; }
    .share-text, .bottom-text { font-size: 11px; color: #333; }
    .bottom-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; padding: 0 20px; }
  </style>
</head>
<body>
  <audio id="achievementAudio" preload="auto"><source src="../../public/assets/audio/achievement.mp3" type="audio/mpeg"></audio>
  <div class="header">
    <div class="header-icon" id="exit-button"><span class="material-symbols-outlined">close</span></div>
    <div class="header-icon" id="share-button"><span class="material-symbols-outlined">upload</span></div>
  </div>
  <div class="app">
    <div class="scene">
      <div class="achievement-diamond" id="diamond">
        <div class="achievement-diamond-content">
          <span class="material-symbols-outlined achievement-icon" id="icon">exercise</span>
          <div class="achievement-number" id="number">30000</div>
        </div>
      </div>
    </div>
    <div class="achievement-title" id="achievementTitle">XP Powerhouse</div>
    <div class="achievement-date" id="currentDate"></div>
    <div class="title-text" id="message">You earned XP Powerhouse by gaining 30000 XP!</div>
    <div class="buttons-container">
      <button class="action-button" id="claimRewardBtn">CLAIM REWARD</button>
    </div>
  </div>

  <div class="share-overlay" id="share-overlay">
    <div class="share-content">
      <div class="share-card" id="share-card">
        <div class="achievement-diamond" id="shareDiamond"><div class="achievement-diamond-content"><span class="material-symbols-outlined" id="shareIcon">exercise</span><div class="achievement-number" id="shareNumber">30000</div></div></div>
        <div class="achievement-title" id="shareTitle">XP Powerhouse</div>
        <div class="achievement-date" id="shareDate"></div>
        <div class="title-text" id="shareMessage">I earned XP Powerhouse by gaining 30000 XP!</div>
        <div class="share-brand">vulanet</div>
      </div>
      <div class="share-sheet">
        <div class="share-grid">
          <div class="share-item" id="share-facebook"><div class="share-icon-circle"><div class="share-icon"><img src="../../public/assets/icons/social/facebook-full.svg"></div></div><div class="share-text">Facebook</div></div>
          <div class="share-item" id="share-x"><div class="share-icon-circle"><div class="share-icon"><img src="../../public/assets/icons/social/x-twitter-brands-solid-full.svg"></div></div><div class="share-text">X</div></div>
          <div class="share-item" id="share-whatsapp"><div class="share-icon-circle"><div class="share-icon"><img src="../../public/assets/icons/social/whatsapp.svg"></div></div><div class="share-text">WhatsApp</div></div>
          <div class="share-item" id="share-sms"><div class="share-icon-circle"><div class="share-icon"><span class="material-symbols-outlined">sms</span></div></div><div class="share-text">Message</div></div>
        </div>
        <div class="bottom-grid">
          <div class="bottom-item" id="save-image"><div class="bottom-icon-circle"><div class="bottom-icon"><span class="material-symbols-outlined">download</span></div></div><div class="bottom-text">Save image</div></div>
          <div class="bottom-item" id="more-options"><div class="bottom-icon-circle"><div class="bottom-icon"><span class="material-symbols-outlined">more_horiz</span></div></div><div class="bottom-text">More</div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const achievementName = params.get('name') || 'XP Powerhouse';
    const icon = params.get('icon') || 'exercise';
    const level = params.get('level') || '10';
    const number = params.get('number') || '30000';
    const message = params.get('message') || `You earned ${achievementName} by gaining ${number} XP!`;
    const coins = parseInt(params.get('coins')||'500');

    document.getElementById('icon').textContent = icon;
    document.getElementById('number').textContent = number;
    document.getElementById('achievementTitle').textContent = achievementName;
    document.getElementById('message').textContent = message;
    document.getElementById('shareIcon').textContent = icon;
    document.getElementById('shareNumber').textContent = number;
    document.getElementById('shareTitle').textContent = achievementName;
    document.getElementById('shareMessage').textContent = message;
    const now = new Date();
    const dateStr = `${now.getDate()} ${now.toLocaleString('en-US',{month:'long'})} ${now.getFullYear()}`;
    document.getElementById('currentDate').textContent = dateStr;
    document.getElementById('shareDate').textContent = dateStr;

    document.getElementById('achievementAudio').play().catch(()=>{});

    const shareOverlay = document.getElementById('share-overlay');
    document.getElementById('share-button').addEventListener('click', ()=> shareOverlay.style.display='flex');
    shareOverlay.addEventListener('click', e=>{ if(e.target===shareOverlay) shareOverlay.style.display='none'; });
    document.getElementById('exit-button').addEventListener('click', ()=> window.parent.postMessage('modalClose','*'));

    document.getElementById('claimRewardBtn').addEventListener('click', ()=>{
      const current = parseInt(localStorage.getItem('coins')||'500',10);
      localStorage.setItem('coins', current + coins);
      window.parent.postMessage('modalClose','*');
    });

    document.getElementById('save-image').addEventListener('click', async ()=>{
      const card = document.getElementById('share-card');
      await document.fonts.ready;
      html2canvas(card,{scale:2,useCORS:true}).then(canvas=>{
        const a=document.createElement('a'); a.download='achievement.png'; a.href=canvas.toDataURL('image/png'); a.click();
      });
    });
    document.getElementById('share-facebook').addEventListener('click', ()=>{
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent("https://vulanet.com/achievement")}&quote=${encodeURIComponent(message)}`);
    });
    document.getElementById('share-x').addEventListener('click', ()=>{
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(message)}`);
    });
    document.getElementById('share-whatsapp').addEventListener('click', ()=>{
      window.open(`https://wa.me/?text=${encodeURIComponent(message)}`);
    });
    document.getElementById('share-sms').addEventListener('click', ()=>{
      if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) window.location.href = `sms:?body=${encodeURIComponent(message)}`;
      else navigator.clipboard.writeText(message);
    });
    document.getElementById('more-options').addEventListener('click', async ()=>{
      if(navigator.share) await navigator.share({ title:'Vulanet Achievement', text: message });
    });
  </script>
</body>
</html>
