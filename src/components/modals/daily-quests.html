<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Daily Quests</title>

  <link rel="stylesheet" href="public/assets/fonts/fonts.css">
  <link rel="stylesheet" href="src/styles/components/buttons.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .daily-quests-module { max-width: 500px; width: 100%; margin: 0 auto; }
    .section-title { font-size: 22px; margin: 0; color: #3b3b3b; font-weight: 700; }
    .time-cta { color: #ff9f1a; font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .clock-icon { width: 18px; height: 18px; display: inline-block; }
    .clock-icon img { width: 100%; height: 100%; display: block; }
    .card { background: #ffffff; border-radius: 18px; border: 1px solid #eee; box-shadow: 0 6px 18px rgba(15,15,15,0.06); margin-bottom: 24px; }
    .quests { margin-top: 8px; border-radius: 14px; overflow: hidden; border: 1px solid #eee; }
    .quest-row { padding: 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f0f0f0; background: #fff; }
    .quest-row:last-child { border-bottom: 0; }
    .quest-info { flex: 1; }
    .quest-title { font-weight: 700; margin: 0 0 10px; color: #444; font-size: 15px; }
    .progress-wrapper { position: relative; width: 100%; }
    .progress-bar { height: 28px; background: #e6e6e6; border-radius: 20px; position: relative; overflow: hidden; display: flex; align-items: center; }
    .progress-inner { height: 12px; background: #ffa726; border-radius: 12px; box-shadow: inset 0 -4px 8px rgba(255,255,255,0.25); }
    .progress-count { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; font-weight: 700; letter-spacing: 1px; font-size: 13px; z-index: 2; text-shadow: 0 1px 2px rgba(0,0,0,0.1); pointer-events: none; white-space: nowrap; }
    .progress-count.dark-text { color: #666; text-shadow: none; }
    .chest { width: 44px; height: 44px; border-radius: 8px; flex: 0 0 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s ease; }
    .chest:hover:not(.claimed) { transform: scale(1.05); }
    .chest.claimed { opacity: 0.5; cursor: default; }
    .chest-icon { width: 32px; height: 32px; display: inline-block; }
    .chest-icon img { width: 100%; height: 100%; display: block; }
    .bronze .chest-icon img { filter: brightness(0) saturate(100%) invert(55%) sepia(46%) saturate(1036%) hue-rotate(341deg) brightness(91%) contrast(91%); }
    .silver .chest-icon img { filter: brightness(0) saturate(100%) invert(83%) sepia(0%) saturate(0%) hue-rotate(172deg) brightness(92%) contrast(89%); }
    .gold .chest-icon img { filter: brightness(0) saturate(100%) invert(84%) sepia(47%) saturate(1500%) hue-rotate(357deg) brightness(104%) contrast(101%); }
    .daily-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .continue-btn { width: 100%; margin-top: 8px; }

    @media (max-width: 480px) {
      .quest-row { padding: 14px; }
      .quest-title { font-size: 14px; }
      .chest { width: 40px; height: 40px; flex: 0 0 40px; }
      .chest-icon { width: 28px; height: 28px; }
    }
  </style>
</head>

<body>
<div class="daily-quests-module">
  <div class="daily-header-row">
    <div class="section-title">Daily Quests</div>
    <div class="time-cta">
      <span class="clock-icon"><img src="public/assets/icons/phosphor/regular/clock-countdown.svg" alt="Clock"></span>
      <span id="timeRemaining">0 MINUTES</span>
    </div>
  </div>

  <div class="card quests" id="questsContainer">
    <!-- Dynamic quests inserted via JS -->
  </div>

  <button class="btn btn-md btn-carpenter-blue continue-btn" id="continueBtn">CONTINUE</button>
</div>

<script>
  (function() {
    const audio = new Audio('public/assets/audio/quest.mp3');
    audio.play().catch(() => {});

    let questsData = [];
    let claimedChests = { bronze: false, silver: false, gold: false };

    window.updateDailyQuests = function(quests, timeRemainingMinutes) {
      questsData = quests;
      const container = document.getElementById('questsContainer');
      const timeSpan = document.getElementById('timeRemaining');
      timeSpan.textContent = `${timeRemainingMinutes} MINUTES`;
      
      container.innerHTML = '';
      
      const tiers = ['bronze', 'silver', 'gold'];
      const chestColors = { bronze: 'bronze', silver: 'silver', gold: 'gold' };
      
      quests.forEach((quest, index) => {
        const tier = tiers[index];
        const isComplete = quest.current >= quest.target;
        const chestClaimed = claimedChests[tier];
        const chestClass = chestClaimed ? 'chest claimed' : 'chest';
        
        const row = document.createElement('div');
        row.className = 'quest-row';
        
        const percentComplete = (quest.current / quest.target) * 100;
        const fillWidth = percentComplete > 0 ? percentComplete : 0;
        const showLeftMargin = fillWidth > 0 && fillWidth < 100;
        
        row.innerHTML = `
          <div class="quest-info">
            <div class="quest-title">${quest.title}</div>
            <div class="progress-wrapper">
              <div class="progress-bar">
                <div class="progress-inner" style="width: calc(${fillWidth}% - ${showLeftMargin ? '20px' : '0px'}); margin-left: ${showLeftMargin ? '10px' : '0px'};"></div>
                <div class="progress-count ${!isComplete && fillWidth < 30 ? 'dark-text' : ''}">${quest.current} / ${quest.target}</div>
              </div>
            </div>
          </div>
          <div class="${chestClass} ${chestColors[tier]}" data-tier="${tier}" data-complete="${isComplete}" data-claimed="${chestClaimed}">
            <span class="chest-icon">
              <img src="public/assets/icons/phosphor/regular/treasure-chest.svg" alt="Chest">
            </span>
          </div>
        `;
        
        container.appendChild(row);
      });
      
      // Add chest click handlers
      document.querySelectorAll('.chest:not(.claimed)').forEach(chest => {
        const tier = chest.dataset.tier;
        const isComplete = chest.dataset.complete === 'true';
        
        chest.addEventListener('click', () => {
          if (isComplete && !claimedChests[tier]) {
            claimedChests[tier] = true;
            chest.classList.add('claimed');
            
            if (window.parent !== window) {
              window.parent.postMessage({ action: 'claimQuestReward', tier: tier }, '*');
            }
          }
        });
      });
    };
    
    // Function to reset claimed chests (for new day)
    window.resetDailyQuestsClaimed = function() {
      claimedChests = { bronze: false, silver: false, gold: false };
    };
    
    const continueBtn = document.getElementById('continueBtn');
    continueBtn.addEventListener('click', () => {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'continueFromQuests' }, '*');
      }
    });
  })();
</script>
</body>
</html>
