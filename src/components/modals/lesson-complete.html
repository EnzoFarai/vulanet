<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Complete</title>
<link rel="stylesheet" href="../../../public/assets/fonts/fonts.css">
<link rel="stylesheet" href="../../../src/styles/components/buttons.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Atkinson Hyperlegible Next', sans-serif; background: #FFFFFF; display: flex; justify-content: center; position: relative; overflow: hidden; min-height: 100vh; }
  .app { width: 100%; max-width: 420px; min-height: 100vh; padding: 24px 18px 28px; display: flex; flex-direction: column; align-items: center; z-index: 20; background: transparent; }
  .title { margin-top: 12px; text-align: center; font-weight: 900; color: #ffd24a; font-size: 34px; line-height: 1.1; text-shadow: 0 1px 2px rgba(0,0,0,0.1); z-index: 30; }
  .scene { width: 100%; height: 260px; margin-top: 10px; display: flex; justify-content: center; align-items: center; z-index: 30; }
  .emoji-container { width: 160px; height: 160px; animation: bounce 2s ease-in-out infinite; z-index: 40; }
  lottie-player { width: 160px !important; height: 160px !important; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
  .stats { width: 100%; display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-top: 18px; z-index: 30; }
  .stat { background: #FFFFFF; border-radius: 16px; border: 2px solid; overflow: hidden; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; transition: all 0.3s ease; }
  .stat-header { padding: 12px 6px; color: #FFFFFF; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; }
  .stat-content { padding: 14px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .stat .value { font-size: 18px; font-weight: 900; letter-spacing: .5px; display: flex; align-items: center; gap: 6px; }
  .stat-icon { width: 20px; height: 20px; display: inline-block; }
  .stat-icon img { width: 100%; height: 100%; object-fit: contain; }
  .continue-wrap { position: fixed; bottom: 0; left: 0; right: 0; background: #FFFFFF; padding: 14px 16px 22px; border-top: 1px solid #ededed; z-index: 100; width: 100%; }
  .continue { width: 100%; max-width: 420px; margin: 0 auto; height: 52px; border-radius: 0.75rem; font-weight: 700; letter-spacing: 0.5px; border: none; font-size: 15px; text-transform: uppercase; cursor: pointer; font-family: 'Atkinson Hyperlegible Next', sans-serif; display: block; }
  
  /* Fireworks - Restored to original complex animation */
  .fireworks-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; justify-content: space-around; align-items: center; padding: 0 50px; }
  .fireworks { position: relative; z-index: 15; width: 2.5em; height: 2em; background: transparent; animation: flatify-firework 4s infinite; font-size: 2.5em; }
  .fireworks:before,.fireworks .spark:before,.fireworks .spark:after { content: " "; position: absolute; height: 0.25em; border-radius: 50em; background: var(--flatify__firework-color-main); }
  .fireworks:before { top:0; bottom:0; left:0; right:0; width:0.25em; margin:auto; animation: flatify-firework-main 4s infinite; }
  .fireworks .spark { position: absolute; top:0; left:0; width:100%; height:100%; animation: flatify-firework-sparks 4s infinite; }
  .fireworks .spark:nth-child(1):before,.fireworks .spark:nth-child(2):before { left:-0.25em; animation: flatify-firework-spark-left 4s infinite; }
  .fireworks .spark:nth-child(1):after,.fireworks .spark:nth-child(2):after { right:-0.25em; animation: flatify-firework-spark-right 4s infinite; }
  .fireworks .spark:nth-child(2) { transform: rotate(90deg); }
  .fireworks .spark:nth-child(3),.fireworks .spark:nth-child(4) { left:0; }
  .fireworks .spark:nth-child(3):before,.fireworks .spark:nth-child(4):before { top:0; transform: rotate(45deg); animation: flatify-firework-spark-corner-top 4s infinite; }
  .fireworks .spark:nth-child(3):after,.fireworks .spark:nth-child(4):after { bottom:0; transform: rotate(-45deg); animation: flatify-firework-spark-corner-bottom 4s infinite; }
  .fireworks .spark:nth-child(4) { transform: rotate(180deg); }
  .fireworks-1 { align-self: flex-start; transform: rotate(-30deg); position: relative; top: 200px; left: 50px; }
  .fireworks-2 { align-self: center; position: relative; top: 200px; }
  .fireworks-3 { align-self: flex-start; transform: rotate(30deg); position: relative; top: 200px; right: 50px; }
  
  @keyframes flatify-firework { 0%,20%{transform:translateY(0)} 40%{transform:translateY(-1em)} 80%,100%{transform:translateY(0.5em)} }
  @keyframes flatify-firework-main { 0%{opacity:0;transform:scale(0) translateY(1em)} 5%{opacity:1;transform:scale(0,6) translateY(1em)} 26%{transform:scaleY(2) translateY(0)} 30%{transform:scale(9) translateY(0)} 40%,100%{transform:scale(0) translateY(0)} }
  @keyframes flatify-firework-sparks { 0%,30%{opacity:0} 38%{opacity:1} 65%,100%{opacity:0} }
  @keyframes flatify-firework-spark-corner-top { 0%,30%{opacity:1;clip-path:circle(100% at left);transform:scale(1) translate(0) rotate(45deg)} 40%{clip-path:circle(100% at left)} 60%,100%{opacity:0;clip-path:circle(0 at left);transform:scale(1.5) translate(-0.5em,-0.25em) rotate(45deg)} }
  @keyframes flatify-firework-spark-corner-bottom { 0%,30%{opacity:1;clip-path:circle(100% at left);transform:scale(1) translate(0) rotate(-45deg)} 40%{clip-path:circle(100% at left)} 60%,100%{opacity:0;clip-path:circle(0 at left);transform:scale(1.5) translate(-0.5em,0.25em) rotate(-45deg)} }
  @keyframes flatify-firework-spark-left { 0%,30%{opacity:1;clip-path:circle(100% at left);transform:scale(1) translate(0)} 40%{clip-path:circle(100% at left)} 60%,100%{opacity:0;clip-path:circle(0 at left);transform:scaleX(2) translate(-0.5em)} }
  @keyframes flatify-firework-spark-right { 0%,30%{opacity:1;clip-path:circle(100% at right);transform:scale(1) translate(0)} 40%{clip-path:circle(100% at right)} 60%,100%{opacity:0;clip-path:circle(0 at right);transform:scaleX(2) translate(0.5em)} }
</style>
</head>
<body>
<div class="fireworks-wrapper">
  <div class="fireworks fireworks-1" style="--flatify__firework-color-main:#5D9CEC"><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span></div>
  <div class="fireworks fireworks-2" style="--flatify__firework-color-main:#ffce54"><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span></div>
  <div class="fireworks fireworks-3" style="--flatify__firework-color-main:#967ADC"><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span></div>
</div>
<div class="app">
  <div class="title">Lesson complete!</div>
  <div class="scene">
    <div class="emoji-container">
      <lottie-player src="../../../public/assets/lottie/1f973.json" background="transparent" speed="1" loop autoplay></lottie-player>
    </div>
  </div>
  <div class="stats" id="statsContainer"></div>
</div>
<div class="continue-wrap">
  <button class="btn btn-md btn-carpenter-blue continue" id="continueBtn">CONTINUE</button>
</div>
<script src="../../../src/lib/lottie-player.js"></script>
<script>
  const audio = new Audio('../../../public/assets/audio/complete.mp3'); audio.play().catch(()=>{});
  const params = new URLSearchParams(window.location.search);
  
  // IMPORTANT: correctAttempts = number of UNIQUE questions correct on first attempt
  // totalQuestions = total number of questions in the lesson
  let correct = parseInt(params.get('correctAttempts')) || 0;
  let totalQuestions = parseInt(params.get('totalQuestions')) || 6;
  let time = parseInt(params.get('time')) || 0;
  let boost = parseFloat(params.get('boost')) || null;
  
  // Calculate percentage based on unique questions correct vs total questions
  let percentage = Math.round((correct / totalQuestions) * 100);
  
  // Accuracy XP = round((correct / total_questions) × 10), max 10
  let accuracyXP = Math.round((correct / totalQuestions) * 10);
  accuracyXP = Math.min(accuracyXP, 10);
  
  // Speed XP calculation
  const T_expected = totalQuestions * 15;
  const T_max = 2 * T_expected;
  let speedXP = 0;
  if (time <= T_expected) {
    speedXP = 10;
  } else if (time > T_expected && time <= T_max) {
    speedXP = Math.round(10 * (2 - (time / T_expected)));
    if (speedXP < 0) speedXP = 0;
  } else {
    speedXP = 0;
  }
  
  // Total XP = 10 (completion) + accuracyXP + speedXP
  let totalXP = 10 + accuracyXP + speedXP;
  
  // Apply boost if active
  let displayXP = totalXP;
  let xpHeader = "TOTAL XP";
  let xpColor = "#FBBC05"; // Bee color (default)
  if (boost !== null && boost > 1) {
    displayXP = Math.round(totalXP * boost);
    xpHeader = "XP BOOST";
    xpColor = "#FF6D01"; // Tiger color (only for boost)
  }
  
  // Format time string
  let timeString = "";
  if (time < 60) {
    timeString = `${time}s`;
  } else if (time < 3600) {
    let minutes = Math.floor(time / 60);
    let seconds = time % 60;
    timeString = seconds > 0 ? `${minutes}m ${seconds}s` : `${minutes}m`;
  } else {
    let hours = Math.floor(time / 3600);
    let remainingMinutes = Math.floor((time % 3600) / 60);
    timeString = remainingMinutes > 0 ? `${hours}h ${remainingMinutes}m` : `${hours}h`;
  }
  
  // Committed/WHOA label
  let committedLabel = time <= T_expected ? "WHOA" : "COMMITTED";
  
  // Accuracy label based on percentage
  let accuracyLabel = "";
  if (percentage === 100) accuracyLabel = "PERFECT";
  else if (percentage >= 80) accuracyLabel = "OUTSTANDING";
  else if (percentage >= 50) accuracyLabel = "NICE";
  else accuracyLabel = "YIKES";
  
  // CSS filters for icon colors
  const lightningFilter = "brightness(0) saturate(100%) invert(85%) sepia(24%) saturate(1148%) hue-rotate(3deg) brightness(104%) contrast(103%)";
  const clockFilter = "brightness(0) saturate(100%) invert(44%) sepia(57%) saturate(1662%) hue-rotate(198deg) brightness(96%) contrast(94%)";
  const targetFilter = "brightness(0) saturate(100%) invert(53%) sepia(78%) saturate(500%) hue-rotate(86deg) brightness(94%) contrast(91%)";
  
  document.getElementById('statsContainer').innerHTML = `
    <div class="stat" style="border-color: ${xpColor}">
      <div class="stat-header" style="background: ${xpColor}">${xpHeader}</div>
      <div class="stat-content">
        <div class="value">
          <span class="stat-icon"><img src="../../../public/assets/icons/phosphor/fill/lightning.svg" alt="XP" style="filter: ${lightningFilter}; width:20px;height:20px;"></span>
          <span>${displayXP}</span>
        </div>
      </div>
    </div>
    <div class="stat" style="border-color: #4285F4">
      <div class="stat-header" style="background: #4285F4">${committedLabel}</div>
      <div class="stat-content">
        <div class="value">
          <span class="stat-icon"><img src="../../../public/assets/icons/phosphor/duotone/clock-countdown.svg" alt="Time" style="filter: ${clockFilter}; width:20px;height:20px;"></span>
          <span>${timeString}</span>
        </div>
      </div>
    </div>
    <div class="stat" style="border-color: #34A853">
      <div class="stat-header" style="background: #34A853">${accuracyLabel}</div>
      <div class="stat-content">
        <div class="value">
          <span class="stat-icon"><img src="../../../public/assets/icons/phosphor/duotone/target.svg" alt="Percentage" style="filter: ${targetFilter}; width:20px;height:20px;"></span>
          <span>${percentage}%</span>
        </div>
      </div>
    </div>
  `;
  
  document.getElementById('continueBtn').addEventListener('click', () => window.parent.postMessage('modalClose', '*'));
</script>
</body>
</html>
