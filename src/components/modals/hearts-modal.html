<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hearts Modal</title>

  <!-- Local Fonts -->
  <link rel="stylesheet" href="../../../public/assets/fonts/fonts.css">

  <!-- Button Styles -->
  <link rel="stylesheet" href="../../../src/styles/components/buttons.css">

  <style>
    :root {
      --color-background: #f0f3f6;
      --color-background-gradient-start: #f7f9fa;
      --color-background-gradient-end: #eef2f5;
      --color-overlay: rgba(0, 0, 0, 0.55);
      --color-white: #ffffff;
      --color-heart-red: #EA4335;
      --color-text-primary: #4B4B4B;
      --color-text-secondary: #777777;
      --spacing-xs: 4px; --spacing-sm: 8px; --spacing-md: 12px; --spacing-lg: 18px; --spacing-xl: 24px; --spacing-xxl: 32px;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 14px;
      --font-family-primary: 'Atkinson Hyperlegible Next', system-ui, -apple-system, sans-serif;
      --font-size-xs: 12px; --font-size-sm: 14px; --font-size-md: 16px; --font-size-xl: 20px; --font-size-xxl: 22px;
      --card-width: 88%; --card-max-width: 400px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--color-background); font-family: var(--font-family-primary); line-height: 1.5; }
    .page-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--spacing-xl); background: linear-gradient(var(--color-background-gradient-start), var(--color-background-gradient-end)); }
    .modal-overlay { position: fixed; inset: 0; background: var(--color-overlay); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .modal { width: var(--card-width); max-width: var(--card-max-width); background: var(--color-white); border-radius: var(--radius-lg); padding: var(--spacing-xl) var(--spacing-lg) var(--spacing-lg); box-shadow: 0 20px 40px rgba(17, 24, 39, 0.2); text-align: center; position: relative; animation: modal-appear 0.3s ease-out; }
    @keyframes modal-appear { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    .hearts-display { display: flex; align-items: center; justify-content: center; gap: var(--spacing-sm); margin-bottom: var(--spacing-lg); }
    .heart-icon { width: 36px; height: 36px; display: inline-block; transition: all 0.3s ease; }
    .heart-icon img { width: 100%; height: 100%; display: block; }
    
    /* CSS filter to make hearts #EA4335 */
    .heart-icon img {
      filter: brightness(0) saturate(100%) invert(33%) sepia(98%) saturate(1748%) hue-rotate(330deg) brightness(97%) contrast(94%);
    }
    
    .hearts-count { font-weight: 700; color: var(--color-heart-red); font-size: var(--font-size-xxl); transition: all 0.3s ease; font-family: var(--font-family-primary); }
    .modal-title { font-size: var(--font-size-xl); margin: var(--spacing-xs) 0 var(--spacing-xs); color: var(--color-text-primary); font-weight: 700; font-family: var(--font-family-primary); }
    .modal-description { margin: 0 var(--spacing-lg) var(--spacing-lg); color: var(--color-text-secondary); font-size: var(--font-size-sm); font-family: var(--font-family-primary); }
    .modal .btn { max-width: 100%; width: 100%; margin-top: 8px; }
    @media (max-width: 420px) { :root { --card-width: 92%; } }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="modal-overlay">
      <div class="modal">
        <div class="hearts-display" aria-label="5 hearts remaining">
          <div class="heart-icon">
            <img src="../../../public/assets/icons/phosphor/fill/heart.svg" alt="Heart icon" id="heart-img">
          </div>
          <div class="hearts-count" id="hearts-count">5</div>
        </div>
        <h2 id="modal-title" class="modal-title">Each mistake costs 1 heart!</h2>
        <p id="modal-description" class="modal-description">You have 5 hearts. Stay sharp and focused to keep your hearts.</p>
        <button class="btn btn-md btn-gecko-solid" id="action-button">I GOT THIS</button>
      </div>
    </div>
  </div>
  <script>
    const heartImg = document.getElementById('heart-img');
    const heartsCount = document.getElementById('hearts-count');
    const actionButton = document.getElementById('action-button');
    const HEART_FILL_PATH = '../../../public/assets/icons/phosphor/fill/heart.svg';
    const HEART_EMPTY_PATH = '../../../public/assets/icons/phosphor/regular/heart.svg';
    let count = 5;
    
    function updateHeartIcon() {
      // Show filled heart when count > 0, empty heart only when count === 0
      if (count > 0) {
        heartImg.src = HEART_FILL_PATH;
      } else {
        heartImg.src = HEART_EMPTY_PATH;
      }
    }
    
    function startCountdown() {
      const interval = setInterval(() => {
        count--;
        heartsCount.textContent = count;
        heartsCount.style.transform = 'scale(1.2)';
        setTimeout(() => heartsCount.style.transform = 'scale(1)', 150);
        
        // Update heart icon based on new count value
        updateHeartIcon();
        
        if (count === 0) { 
          clearInterval(interval); 
          setTimeout(() => { 
            count = 5; 
            heartsCount.textContent = '5'; 
            updateHeartIcon(); 
            startCountdown(); 
          }, 1000); 
        }
      }, 600);
    }
    
    startCountdown();
    actionButton.addEventListener('click', () => window.parent.postMessage('modalClose', '*'));
  </script>
</body>
</html>
