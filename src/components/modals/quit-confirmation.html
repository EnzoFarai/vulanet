<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quit Confirmation</title>
<link rel="stylesheet" href="../../../public/assets/fonts/fonts.css">
<link rel="stylesheet" href="../../../src/styles/components/buttons.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Atkinson Hyperlegible Next', system-ui, -apple-system, sans-serif; background: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .app { width: 100%; max-width: 420px; padding: 24px 18px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .scene { width: 100%; height: 200px; margin-top: 20px; display: flex; justify-content: center; align-items: center; }
  .emoji-container { width: 160px; height: 160px; }
  lottie-player { width: 160px !important; height: 160px !important; }
  .title { margin-top: 20px; text-align: center; font-weight: 700; color: #4B4B4B; font-size: 20px; line-height: 1.4; max-width: 320px; }
  .buttons-container { width: 100%; display: flex; flex-direction: column; gap: 16px; margin-top: 40px; }
</style>
</head>
<body>
<audio id="quitAudio" preload="auto"><source src="../../../public/assets/audio/quit.mp3" type="audio/mpeg"></audio>
<div class="app">
  <div class="scene">
    <div class="emoji-container">
      <lottie-player src="../../../public/assets/lottie/1f627.json" background="transparent" speed="1" loop autoplay></lottie-player>
    </div>
  </div>
  <div class="title">Are you sure you want to quit? You'll lose all XP gained in this lesson.</div>
  <div class="buttons-container">
    <button class="btn btn-md btn-carpenter-blue" id="keepGoingBtn">KEEP GOING</button>
    <button class="btn btn-md btn-ladybug-outline" id="quitBtn">QUIT</button>
  </div>
</div>
<script src="../../../src/lib/lottie-player.js"></script>
<script>
  const audio = document.getElementById('quitAudio'); audio.play().catch(()=>{});
  document.getElementById('keepGoingBtn').addEventListener('click', () => window.parent.postMessage('modalClose', '*'));
  document.getElementById('quitBtn').addEventListener('click', () => window.parent.postMessage('modalQuit', '*'));
</script>
</body>
</html>
