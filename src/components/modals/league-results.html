<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Results</title>

<!-- Local Fonts -->
<link rel="stylesheet" href="../../../assets/fonts/fonts.css">

<!-- Button Styles -->
<link rel="stylesheet" href="../../../src/styles/components/buttons.css">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Atkinson Hyperlegible Next', sans-serif;
    background: #ffffff;
    color: #0f1c22;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* ============================================================
     Header — close X (consistent with achievement.html /
     record.html reward modals). Both the X and Continue post
     modalClose; this modal credits nothing.
     ============================================================ */
  .header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 20px;
    background: transparent;
    z-index: 100;
  }
  .header-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 50%;
    transition: background 0.15s ease;
  }
  .header-icon:hover { background: rgba(0, 0, 0, 0.04); }
  .header-icon img {
    width: 24px;
    height: 24px;
    filter: brightness(0) saturate(100%) invert(63%) sepia(0%)
            saturate(0%) hue-rotate(180deg) brightness(88%) contrast(85%);
  }

  /* ============================================================
     App shell
     ============================================================ */
  .app {
    max-width: 420px;
    width: 100%;
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ============================================================
     Scene — the medals strip IS the hero (Codes 2/3/4).
     No separate hero medal block.
     ============================================================ */
  .scene {
    width: 100%;
    height: 220px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .medals-container {
    display: flex;
    gap: 12px;
    padding: 12px calc(50% - 50px);
    width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .medals-container::-webkit-scrollbar { display: none; }

  .medal {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 70px;
    flex-shrink: 0;
    transition: transform 0.3s ease, min-width 0.3s ease;
  }

  /* Icon shape via mask; colour via --medal-color (unset → grey). */
  .medal-icon {
    width: 32px;
    height: 32px;
    background-color: var(--medal-color, #5F6368);
    -webkit-mask: url('../../../assets/icons/phosphor/fill/medal.svg') center / contain no-repeat;
    mask: url('../../../assets/icons/phosphor/fill/medal.svg') center / contain no-repeat;
    transition: width 0.3s ease, height 0.3s ease, opacity 0.3s ease;
  }
  .medal.locked .medal-icon { opacity: 0.8; }

  .medal-label {
    font-size: 12px;
    margin-top: 6px;
    font-weight: 700;
    white-space: nowrap;
    color: #5F6368;
    transition: color 0.3s ease, font-size 0.3s ease, font-weight 0.3s ease;
  }
  .medal.reached .medal-label { color: var(--medal-color, #34A853); }

  /* Destination tier — the "spotlight" from Codes 2/3/4. */
  .medal.spotlight {
    min-width: 100px;
    transform: scale(1.4);
  }
  .medal.spotlight .medal-icon {
    width: 48px;
    height: 48px;
  }
  .medal.spotlight .medal-label {
    font-size: 14px;
    font-weight: 900;
  }

  /* ============================================================
     Copy
     ============================================================ */
  .title {
    margin-top: 20px;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    color: #0f1c22;
    line-height: 1.2;
  }
  .subtitle {
    margin-top: 8px;
    font-size: 14px;
    color: #6b7280;
    text-align: center;
    max-width: 320px;
    line-height: 1.5;
  }

  /* ============================================================
     Continue
     ============================================================ */
  .buttons-container {
    width: 100%;
    margin-top: 40px;
  }
  .buttons-container .btn { width: 100%; }

  /* ============================================================
     Responsive
     ============================================================ */
  @media (max-width: 420px) {
    .medal { min-width: 62px; }
    .medal-icon { width: 28px; height: 28px; }
    .medal.spotlight .medal-icon { width: 42px; height: 42px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon" id="exit-button" role="button" aria-label="Close">
    <img src="../../../assets/icons/material-symbols/outline/close.svg" alt="Close">
  </div>
</div>

<div class="app">
  <div class="scene">
    <div class="medals-container" id="medalScroller"></div>
  </div>

  <div class="title" id="resultTitle">League Results</div>
  <div class="subtitle" id="resultMessage">…</div>

  <div class="buttons-container">
    <button class="btn btn-md btn-carpenter-blue" id="continueBtn" type="button">CONTINUE</button>
  </div>
</div>

<script>
  // ============================================================
  // VULANET LEAGUE RESULTS MODAL
  // ============================================================
  //
  // Display-only modal. NO claim handshake — the parent
  // (leaderboard.html) has already finalised entitlements before
  // opening this modal. Tapping Continue or the close X simply
  // posts 'modalClose'.
  //
  // URL params: outcome, rank, from_league, to_league.
  //
  // Medal colours are the canonical palette from migration 0010's
  // client spec (§10.A). Matches leaderboard.html — keep in sync
  // if the palette changes.
  // ============================================================

  (function () {
    const LEAGUES = [
      { name: 'Beginner',     rank: 1, color: '#34A853' },
      { name: 'Amateur',      rank: 2, color: '#EA4335' },
      { name: 'Professional', rank: 3, color: '#4285F4' },
      { name: 'Bronze',       rank: 4, color: '#957A34' },
      { name: 'Silver',       rank: 5, color: '#C0C0C0' },
      { name: 'Gold',         rank: 6, color: '#D4AF37' },
      { name: 'Superstar',    rank: 7, color: '#E37400' },
      { name: 'Legendary',    rank: 8, color: '#FFC0CB' },
      { name: 'Ultimate',     rank: 9, color: '#4B0082' }
    ];

    function rankOf(name) {
      const found = LEAGUES.find(l => l.name === name);
      return found ? found.rank : 1;
    }

    // ---- URL params ----
    const params     = new URLSearchParams(window.location.search);
    const outcome    = (params.get('outcome')     || 'retained').toLowerCase();
    const rank       = parseInt(params.get('rank'), 10) || 0;
    const fromLeague = params.get('from_league') || 'Beginner';
    const toLeague   = params.get('to_league')   || fromLeague;

    // ---- Copy per outcome ----
    let titleText   = 'League Results';
    let messageText = '';
    if (outcome === 'promoted') {
      titleText   = 'Congratulations!';
      messageText = `You finished #${rank} and now advance to the ${toLeague} League!`;
    } else if (outcome === 'relegated') {
      titleText   = 'Sorry!';
      messageText = `You finished #${rank} and lose your spot in the ${fromLeague} League.`;
    } else {
      titleText   = 'Good job!';
      messageText = `You finished #${rank} and get to keep your position in the ${fromLeague} League.`;
    }

    document.getElementById('resultTitle').textContent   = titleText;
    document.getElementById('resultMessage').textContent = messageText;

    // ---- Medals strip ----
    const destRank = rankOf(toLeague);

    const scroller = document.getElementById('medalScroller');
    scroller.innerHTML = LEAGUES.map(l => {
      const reached = l.rank <= destRank;
      const isDest  = l.rank === destRank;
      const styleAttr = reached ? `style="--medal-color:${l.color};"` : '';
      const cls = `medal ${reached ? 'reached' : 'locked'}${isDest ? ' spotlight' : ''}`;
      return `
        <div class="${cls}" data-league="${l.name}" data-rank="${l.rank}" ${styleAttr}>
          <div class="medal-icon" aria-hidden="true"></div>
          <div class="medal-label">${l.name}</div>
        </div>
      `;
    }).join('');

    // Centre the destination medal. The container's
    // padding: 12px calc(50% - 50px) guarantees enough scroll
    // space to centre the first and last medals too.
    requestAnimationFrame(() => {
      const spotlight = scroller.querySelector('.medal.spotlight');
      if (spotlight) {
        spotlight.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });
      }
    });

    // ---- Exit handlers ----
    document.getElementById('continueBtn').addEventListener('click', () => {
      window.parent.postMessage('modalClose', '*');
    });
    document.getElementById('exit-button').addEventListener('click', () => {
      window.parent.postMessage('modalClose', '*');
    });
  })();
</script>
</body>
</html>
