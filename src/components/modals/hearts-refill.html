<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refill Hearts</title>
  
  <link rel="stylesheet" href="public/assets/fonts/fonts.css">
  <link rel="stylesheet" href="src/styles/components/buttons.css">
  <script src="src/lib/lottie-player.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #FFFFFF;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif;
    }

    .modal-container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      padding: 24px 18px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
    }

    .title {
      margin-top: 20px;
      text-align: center;
      font-weight: 700;
      color: #4B4B4B;
      font-size: 20px;
      line-height: 1.4;
      max-width: 320px;
    }

    .subtitle {
      margin-top: 8px;
      text-align: center;
      font-weight: 400;
      color: #4B4B4B;
      font-size: 14px;
      line-height: 1.4;
      max-width: 280px;
    }

    .scene {
      width: 100%;
      height: 200px;
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .emoji-container {
      width: 160px;
      height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    lottie-player {
      width: 160px !important;
      height: 160px !important;
    }

    .buttons-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 40px;
    }

    .buttons-container .btn { width: 100%; max-width: 100%; }
    .coin-icon { width: 18px; height: 18px; display: inline-block; vertical-align: middle; }
    .coin-icon img { width: 100%; height: 100%; display: block; }
    .btn-content { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

    @media (max-width: 768px) {
      .title { font-size: 18px; max-width: 280px; }
      .subtitle { font-size: 13px; max-width: 260px; }
      .scene { height: 180px; }
      .emoji-container { width: 140px; height: 140px; }
      lottie-player { width: 140px !important; height: 140px !important; }
      .buttons-container { margin-top: 30px; }
      .coin-icon { width: 16px; height: 16px; }
    }
  </style>
</head>
<body>
<div class="modal-container">
  <div class="scene">
    <div class="emoji-container">
      <lottie-player
        src="public/assets/lottie/1f494.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
      </lottie-player>
    </div>
  </div>

  <div class="title">You're out of hearts!</div>
  <div class="subtitle">You need hearts to progress and keep learning.</div>

  <div class="buttons-container">
    <button class="btn btn-md btn-carpenter-blue" id="refillBtn">
      <span class="btn-content">
        REFILL FOR 
        <span class="coin-icon"><img src="public/assets/icons/phosphor/regular/coin-vertical.svg" alt="Coin"></span>
        350
      </span>
    </button>
    <button class="btn btn-md btn-cloud-outline" id="noThanksBtn">NO THANKS</button>
  </div>
</div>

<script>
  (function() {
    new Audio('public/assets/audio/out-of-hearts.mp3').play().catch(() => {});

    document.getElementById('refillBtn').addEventListener('click', () => {
      if (window.parent !== window) window.parent.postMessage({ action: 'refillHearts' }, '*');
    });

    document.getElementById('noThanksBtn').addEventListener('click', () => {
      if (window.parent !== window) window.parent.postMessage({ action: 'dismissHeartsModal' }, '*');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.parent !== window) {
        window.parent.postMessage({ action: 'dismissHeartsModal' }, '*');
      }
    });
  })();
</script>
</body>
</html>
