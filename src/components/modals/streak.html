<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streak</title>

  <!-- Local Fonts -->
  <link rel="stylesheet" href="../../../public/assets/fonts/fonts.css">

  <!-- Button Styles (we use btn-carpenter-blue) -->
  <link rel="stylesheet" href="../../../src/styles/components/buttons.css">

  <!-- html2canvas for share image -->
  <script src="../../../src/lib/html2canvas.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #F7F7F7; /* Arctic */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
    }

    .header {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; background: transparent; z-index: 100;
    }
    .header-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .header-icon img { width: 24px; height: 24px; }

    .container { max-width: 400px; width: 100%; margin-top: 40px; text-align: center; }

    .flame { visibility: hidden; opacity: 0; transition: visibility 0s, opacity 0.3s ease; }
    .flame.visible { visibility: visible; opacity: 1; }
    .flame img { width: 110px; height: auto; margin: 0 auto 4px; }

    .streak-number {
      font-size: 72px; font-weight: 700; color: #FF6D01; /* Tiger */
      text-shadow: -4px -4px 0 #FFFFFF, 4px -4px 0 #FFFFFF,
                   -4px  4px 0 #FFFFFF, 4px  4px 0 #FFFFFF;
      margin: 0; line-height: 1.1;
      visibility: hidden; opacity: 0; transition: visibility 0s, opacity 0.3s ease;
    }
    .streak-number.visible { visibility: visible; opacity: 1; }

    .streak-text {
      font-size: 28px; color: #FF6D01; font-weight: 700; margin-top: -6px;
      visibility: hidden; opacity: 0; transition: visibility 0s, opacity 0.3s ease;
    }
    .streak-text.visible { visibility: visible; opacity: 1; }

    .card {
      margin-top: 30px; background: #FFFFFF; border-radius: 22px;
      padding: 18px; box-shadow: 0 0 0 3px #E5E5E5;
    }

    .days { display: flex; justify-content: space-between; margin-bottom: 10px; color: #999; font-weight: 600; font-size: 0.9rem; }
    .days span { width: 38px; text-align: center; }
    .days span.active { color: #FF6D01; }

    .ticks { display: flex; justify-content: space-between; margin-bottom: 16px; }
    .tick {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      transition: all 0.3s ease;
    }
    .tick.orange  { background: #FF6D01; color: white; }
    .tick.grey    { background: #AFAFAF; color: white; }
    .tick.freeze  { background: white; border: 2px solid #EA4335; }
    .tick img { width: 22px; height: 22px; }
    .tick.freeze img {
      /* Color the first-aid icon red */
      filter: brightness(0) saturate(100%) invert(33%) sepia(98%) saturate(1748%) hue-rotate(330deg) brightness(97%) contrast(94%);
    }

    .divider { height: 1px; background: #E5E5E5; margin: 18px 0; }
    .message { font-size: 20px; color: #4B4B4B; font-weight: 600; }
    .continue-wrap { margin-top: 24px; width: 100%; }
    .btn { width: 100%; }

    /* Share overlay unchanged from previous (kept for completeness, identical to earlier) */
    .share-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index:1000; padding:20px; }
    .share-content { width:100%; max-width:357px; background:#f5f5f7; border-radius:24px; overflow:hidden; }
    .share-card { background:#fff; border-radius:24px; padding:32px 24px; margin-bottom:10px; text-align:center; }
    .share-sheet { background:#fff; border-top:1px solid #dadada; border-radius:24px 24px 0 0; padding:16px 12px; }
    .share-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
    .share-item, .bottom-item { display:flex; flex-direction:column; align-items:center; cursor:pointer; }
    .share-icon-circle, .bottom-icon-circle { width:44px; height:44px; border-radius:50%; background:#f0f0f0; display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
    .share-icon, .bottom-icon { width:28px; height:28px; display:flex; align-items:center; justify-content:center; }
    .share-icon img { width:100%; height:100%; object-fit:contain; }
    .share-text, .bottom-text { font-size:11px; color:#333; }
    .bottom-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; padding:0 20px; }
    .mini-streak { display:flex; flex-direction:column; align-items:center; }
    .share-streak-number { font-size:48px; font-weight:700; color:#FF6D01; text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff; }
    .share-streak-text { font-size:22px; color:#FF6D01; font-weight:700; }
    .share-message { font-size:18px; color:#4B4B4B; margin:8px 0; }
    .share-brand { margin-top:16px; font-weight:700; color:#4285F4; font-size:24px; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-icon" id="exit-button">
    <img src="../../../public/assets/icons/phosphor/regular/x.svg" alt="Close">
  </div>
  <div class="header-icon" id="share-button">
    <img src="../../../public/assets/icons/phosphor/regular/export.svg" alt="Share">
  </div>
</div>

<div class="container">
  <div class="flame" id="flame">
    <img src="../../../public/assets/lottie/1f525-static.png" alt="flame">
  </div>

  <h1 class="streak-number" id="streakNumber">1</h1>
  <div class="streak-text" id="streakText">day streak!</div>

  <div class="card">
    <div class="days" id="daysContainer"></div>
    <div class="ticks" id="ticksContainer"></div>
    <div class="divider"></div>
    <div class="message" id="streakMessage"></div>
  </div>

  <div class="continue-wrap">
    <button class="btn btn-md btn-carpenter-blue" id="continueButton">CONTINUE</button>
  </div>
</div>

<!-- Share overlay (same structure as before) -->
<div class="share-overlay" id="share-overlay">
  <div class="share-content">
    <div class="share-card" id="share-card">
      <div class="mini-streak">
        <img src="../../../public/assets/lottie/1f525-static.png" width="60" alt="flame" style="margin-bottom:4px;">
        <div class="share-streak-number" id="shareStreakNumber">1</div>
        <div class="share-streak-text">day streak!</div>
        <div class="share-message" id="shareMessage">You now have an active streak. Do a lesson everyday to extend it.</div>
      </div>
      <div class="share-brand">vulanet</div>
    </div>
    <div class="share-sheet">
      <div class="share-grid">
        <div class="share-item" id="share-facebook"><div class="share-icon-circle"><div class="share-icon"><img src="../../../public/assets/icons/social/facebook-full.svg"></div></div><div class="share-text">Facebook</div></div>
        <div class="share-item" id="share-x"><div class="share-icon-circle"><div class="share-icon"><img src="../../../public/assets/icons/social/x-twitter.svg"></div></div><div class="share-text">X</div></div>
        <div class="share-item" id="share-whatsapp"><div class="share-icon-circle"><div class="share-icon"><img src="../../../public/assets/icons/social/whatsapp.svg"></div></div><div class="share-text">WhatsApp</div></div>
        <div class="share-item" id="share-sms"><div class="share-icon-circle"><div class="share-icon"><img src="../../../public/assets/icons/phosphor/regular/sms.svg"></div></div><div class="share-text">Message</div></div>
      </div>
      <div class="bottom-grid">
        <div class="bottom-item" id="save-image"><div class="bottom-icon-circle"><div class="bottom-icon"><img src="../../../public/assets/icons/phosphor/regular/download.svg"></div></div><div class="bottom-text">Save image</div></div>
        <div class="bottom-item" id="more-options"><div class="bottom-icon-circle"><div class="bottom-icon"><img src="../../../public/assets/icons/phosphor/regular/dots-three-outline.svg"></div></div><div class="bottom-text">More</div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  // =================== READ STREAK DATA ===================
  // Expected structure in localStorage 'streakData':
  // {
  //   currentStreak: number,
  //   timezone: string,        // e.g. "Africa/Johannesburg"
  //   recentDays: [ { date: "2026-05-13", status: "completed" }, ... ]  (7 days, today at index 6)
  // }
  const streakData = JSON.parse(localStorage.getItem('streakData') || 'null');
  if (!streakData) {
    // Fallback – shouldn't happen in production
    document.body.innerHTML = '<div style="text-align:center;padding:2rem;">No streak data.</div>';
    return;
  }

  const currentStreak = streakData.currentStreak;
  const timezone = streakData.timezone || 'UTC';
  const recentDays = streakData.recentDays;  // array of exactly 7 days, index 0 is 6 days ago, index 6 is today

  // =================== GENERATE MESSAGE ===================
  // We need to know if it's the very first streak ever or a reset.
  // The engine can store 'streakMessage' directly; otherwise compute here.
  let message = localStorage.getItem('streakMessage');
  if (!message) {
    // Fallback computation (same logic as engine)
    const now = new Date();
    const hour = now.getHours(); // This is local time; we trust the browser's timezone set by the OS.
    // Average first lesson hour stored by engine
    const avgHour = parseFloat(localStorage.getItem('avgFirstLessonHour')) || 8;
    const everHadStreak = localStorage.getItem('everHadStreak') === 'true';

    if (currentStreak === 1 && !everHadStreak) {
      message = 'You now have an active streak. Do a lesson everyday to extend it.';
      localStorage.setItem('everHadStreak', 'true');
    } else if (currentStreak === 1 && everHadStreak) {
      message = 'You now have an active streak. Do a lesson everyday to extend it.';
    } else if (hour >= 0 && hour < 3) {
      message = 'Night Owl! You extended your streak.';
    } else if (hour >= 6 && hour < 9) {
      message = 'Early Bird! You extended your streak.';
    } else {
      const currentDecimal = hour + (now.getMinutes() / 60);
      if (currentDecimal < avgHour - 0.5) {
        const diffMin = Math.round((avgHour - currentDecimal) * 60);
        if (diffMin >= 60) {
          const diffHr = Math.round(diffMin / 60);
          message = `You extended your streak ${diffHr} hour${diffHr > 1 ? 's' : ''} earlier than usual.`;
        } else {
          message = `You extended your streak ${diffMin} minutes earlier than usual.`;
        }
      } else {
        message = 'You extended your streak!';
      }
    }
    // Update average
    const alpha = 0.2;
    const newAvg = alpha * (hour + now.getMinutes()/60) + (1 - alpha) * avgHour;
    localStorage.setItem('avgFirstLessonHour', newAvg.toString());
  } else {
    // Clear the temporary message so it doesn't persist
    localStorage.removeItem('streakMessage');
  }

  // =================== RENDER DAYS AND TICKS ===================
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const daysContainer = document.getElementById('daysContainer');
  const ticksContainer = document.getElementById('ticksContainer');

  // Build day labels from recentDays dates
  daysContainer.innerHTML = '';
  recentDays.forEach((day, idx) => {
    const d = new Date(day.date + 'T00:00:00'); // parse as local midnight
    const span = document.createElement('span');
    span.textContent = dayNames[d.getDay()];
    if (idx === 6) span.classList.add('active'); // today
    daysContainer.appendChild(span);
  });

  // Build ticks
  ticksContainer.innerHTML = '';
  recentDays.forEach((day, idx) => {
    const tick = document.createElement('div');
    tick.className = 'tick'; // base
    let isToday = (idx === 6);

    if (day.status === 'completed') {
      tick.innerHTML = '<img src="../../../public/assets/icons/phosphor/fill/check-fat.svg" alt="✓">';
      if (isToday) {
        // Today starts grey, will be animated to orange
        tick.classList.add('grey');
        tick.dataset.animate = 'true';
      } else {
        tick.classList.add('orange');
      }
    } else if (day.status === 'revived') {
      tick.innerHTML = '<img src="../../../public/assets/icons/phosphor/fill/first-aid.svg" alt="Freeze">';
      tick.classList.add('freeze');
    } else { // missed
      tick.innerHTML = '<img src="../../../public/assets/icons/phosphor/regular/x.svg" alt="✗">';
      tick.classList.add('grey');
    }
    ticksContainer.appendChild(tick);
  });

  // =================== DISPLAY STREAK NUMBER ===================
  document.getElementById('streakNumber').textContent = currentStreak;
  document.getElementById('streakText').textContent = `${currentStreak} day streak!`;
  document.getElementById('streakMessage').textContent = message;

  // Update share preview
  document.getElementById('shareStreakNumber').textContent = currentStreak;
  document.querySelector('.share-streak-text').textContent = `${currentStreak} day streak!`;
  document.getElementById('shareMessage').textContent = message;

  // =================== ANIMATION ===================
  const flame = document.getElementById('flame');
  const streakNum = document.getElementById('streakNumber');
  const streakTxt = document.getElementById('streakText');

  setTimeout(() => {
    // Animate today's tick from grey to orange (if it was completed)
    const todayTick = document.querySelector('.tick[data-animate="true"]');
    if (todayTick) {
      todayTick.classList.remove('grey');
      todayTick.classList.add('orange');
    }

    flame.classList.add('visible');
    streakNum.classList.add('visible');
    streakTxt.classList.add('visible');
  }, 1000);

  // =================== CLOSE / CONTINUE ===================
  function closeStreak() {
    window.parent.postMessage({ type: 'streakClosed', streakDays: currentStreak }, '*');
    window.parent.postMessage('modalClose', '*');
  }

  document.getElementById('exit-button').addEventListener('click', closeStreak);
  document.getElementById('continueButton').addEventListener('click', closeStreak);

  // =================== SHARE LOGIC (unchanged) ===================
  const shareOverlay = document.getElementById('share-overlay');
  document.getElementById('share-button').addEventListener('click', () => {
    shareOverlay.style.display = 'flex';
  });
  shareOverlay.addEventListener('click', (e) => {
    if (e.target === shareOverlay) shareOverlay.style.display = 'none';
  });

  document.getElementById('save-image').addEventListener('click', async () => {
    const card = document.getElementById('share-card');
    await document.fonts.ready;
    html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'vulanet-streak.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  });

  function getShareText() {
    return `${message} ${currentStreak} day streak! #Vulanet`;
  }

  document.getElementById('share-facebook').addEventListener('click', () => {
    window.open(`https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Fvulanet.com&quote=${encodeURIComponent(getShareText())}`);
  });
  document.getElementById('share-x').addEventListener('click', () => {
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(getShareText())}`);
  });
  document.getElementById('share-whatsapp').addEventListener('click', () => {
    window.open(`https://wa.me/?text=${encodeURIComponent(getShareText())}`);
  });
  document.getElementById('share-sms').addEventListener('click', () => {
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      window.location.href = `sms:?body=${encodeURIComponent(getShareText())}`;
    } else {
      navigator.clipboard.writeText(getShareText()).then(() => alert('Copied!'));
    }
  });
  document.getElementById('more-options').addEventListener('click', async () => {
    if (navigator.share) {
      await navigator.share({ title: 'My Vulanet Streak', text: getShareText(), url: 'https://vulanet.com' });
    } else {
      alert('Share not supported.');
    }
  });
})();
</script>
</body>
</html>
