<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coins Reward</title>
  <link rel="stylesheet" href="../../public/assets/fonts/fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      background: #FFFFFF;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .treasure-panel { width: 100%; max-width: 420px; padding: 40px 24px 48px; display: flex; flex-direction: column; align-items: center; text-align: center; margin: 0 auto; }
    .reward-scene { width: 100%; height: 200px; margin-top: 20px; display: flex; justify-content: center; align-items: center; }
    .coin-container img { width: 140px; height: 140px; }
    .reward-title { margin-top: 20px; font-weight: 700; color: #0f1c22; font-size: 20px; max-width: 320px; }
    .reward-subtitle { margin-top: 8px; font-weight: 400; color: #6b7280; font-size: 14px; max-width: 280px; margin-bottom: 24px; }
    .claim-button {
      width: 100%; height: 58px; border-radius: 0.75rem; font-weight: 700; letter-spacing: 0.5px;
      border: none; font-size: 16px; text-transform: uppercase; cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      color: #ffffff; background-color: #4285F4; border-bottom: 0.25rem solid #3a75d9;
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
    }
    .claim-button:hover { background-color: #3a75d9; transform: translateY(-0.125rem); }
    .claim-button:active { transform: translateY(0.0625rem); border-bottom-width: 0.125rem; }
    .coin-icon { filter: brightness(0) invert(1); width: 20px; height: 20px; }
  </style>
</head>
<body>
  <audio id="coinAudio" preload="auto"><source src="../../public/assets/audio/coins.mp3" type="audio/mpeg"></audio>
  <div class="treasure-panel">
    <div class="reward-scene">
      <div class="coin-container">
        <img src="../../public/assets/icons/phosphor/duotone/coins.svg" alt="coins">
      </div>
    </div>
    <div class="reward-title" id="rewardTitle">You have earned 250 coins!</div>
    <div class="reward-subtitle">Spend them wisely</div>
    <button class="claim-button" id="claimButton">Claim 250 <img src="../../public/assets/icons/phosphor/duotone/coins.svg" class="coin-icon"></button>
  </div>
  <script>
    document.getElementById('coinAudio').play().catch(()=>{});
    const params = new URLSearchParams(window.location.search);
    const amount = parseInt(params.get('amount')) || 250;
    document.getElementById('rewardTitle').textContent = `You have earned ${amount} coins!`;
    document.getElementById('claimButton').innerHTML = `Claim ${amount} <img src="../../public/assets/icons/phosphor/duotone/coins.svg" class="coin-icon">`;
    document.getElementById('claimButton').addEventListener('click', ()=>{
      const coins = parseInt(localStorage.getItem('coins')||'500',10);
      localStorage.setItem('coins', coins + amount);
      window.parent.postMessage('modalClose','*');
    });
  </script>
</body>
</html>
