<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmacology-II – Vulanet</title>
  <link rel="stylesheet" href="public/assets/fonts/fonts.css">
  <link rel="stylesheet" href="src/styles/components/buttons.css">
  <link rel="stylesheet" href="src/styles/learning-path.css">
  <style>
    body { padding-top: 100px; }
  </style>
</head>
<body>

  <main id="learning-path-container"></main>

  <div id="treasure-panel">
    <div class="reward-scene">
      <div class="reward-icon-container" id="reward-icon-container"></div>
    </div>
    <div class="reward-title" id="reward-title"></div>
    <div class="reward-subtitle" id="reward-subtitle"></div>
    <button id="claim-button">Claim</button>
  </div>
  <div id="overlay"></div>

  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>
  <script type="module">
    import { renderLearningPath } from './src/js/course-path.js';
    import { loadLayout } from './src/js/layout.js';

    await loadLayout();

    const courseId = 'pharmacology-ii';
    const chapters = [
      {
        title: 'Anticoagulants',
        lessons: [
          { id: 'intro-anticoagulants', title: 'Introduction to Anticoagulants', type: 'joystick', totalSublessons: 4 },
          { id: 'advanced-parenteral-anticoagulants', title: 'Advanced Parenteral Anticoagulants', type: 'joystick', totalSublessons: 1 },
          { id: 'treasure-anticoag-1', title: 'Midway Checkpoint', type: 'treasure' },
          { id: 'oral-anticoagulants', title: 'Oral Anticoagulants', type: 'joystick', totalSublessons: 1 },
          { id: 'doacs-therapeutic-uses', title: 'DOACs and Therapeutic Uses', type: 'joystick', totalSublessons: 1 },
          { id: 'chapter-review-anticoag', title: 'Chapter Review', type: 'flag' }
        ]
      },
      {
        title: 'Thrombolytics And Antiplatelet Agents',
        lessons: [
          { id: 'fibrinolysis', title: 'Fibrinolysis', type: 'joystick', totalSublessons: 1 },
          { id: 'thrombolytic-drugs', title: 'Thrombolytic Drugs', type: 'joystick', totalSublessons: 1 },
          { id: 'uses-contraindications-thrombolytics', title: 'Uses and Contraindications of Thrombolytics', type: 'joystick', totalSublessons: 1 },
          { id: 'treasure-thrombo-1', title: 'Treasure Chest', type: 'treasure' },
          { id: 'individual-thrombolytics', title: 'Individual Thrombolytic Agents', type: 'joystick', totalSublessons: 1 },
          { id: 'antifibrinolytic-drugs', title: 'Antifibrinolytic Drugs', type: 'joystick', totalSublessons: 1 },
          { id: 'overview-antiplatelet', title: 'Overview of Antiplatelet Drugs', type: 'joystick', totalSublessons: 1 },
          { id: 'treasure-antiplatelet-1', title: 'Treasure Chest', type: 'treasure' },
          { id: 'classes-antiplatelet', title: 'Classes of Antiplatelet Drugs', type: 'joystick', totalSublessons: 1 },
          { id: 'clinical-use-antiplatelet', title: 'Clinical Use of Antiplatelet Drugs', type: 'joystick', totalSublessons: 1 },
          { id: 'chapter-review-thrombo', title: 'Chapter Review', type: 'flag' }
        ]
      }
    ];

    let savedProgress = {};
    try {
      const raw = localStorage.getItem(`vulanet_progress_${courseId}`);
      if (raw) savedProgress = JSON.parse(raw);
    } catch(e) {}

    renderLearningPath({
      containerId: 'learning-path-container',
      chapters,
      userProgress: savedProgress,
      courseId,
      onLessonStart: (lessonId) => {
        window.location.href = `/pages/lesson.html?course=${courseId}&lesson=${lessonId}`;
      }
    });
  </script>
</body>
</html>
